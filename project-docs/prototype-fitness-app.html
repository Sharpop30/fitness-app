<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אב טיפוס אפליקציית מאמן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== מודול העיצוב (D01), גרסה 4: כיוון א׳, "סגול רך" (רענון העיצוב, 03.10.2026; doc-design-refresh-brief) =====
   השראה: LEAP. רקע קריר, כרטיסים לבנים עם צל רך, סגול אחד מוביל, פס צבע בצד לפי סוג המידע, אייקוני קו.
   המספרים באותו גופן כמו הטקסט (Rubik), עם ספרות ברוחב קבוע, ולא בגופן מונו. ניגודיות 4.5:1 לפחות בשני המצבים.
   שמות האסימונים הישנים (accent, lime, line-in, ink) נשארים, כי מסכים משתמשים בהם. */
:root{
  --page:#e9e9f1; --bg:#f3f3f8; --card:#ffffff; --ink:#1a1830; --muted:#5e5b72; --muted2:#5e5b72; --muted3:#67647b;
  --line:#e7e6ef; --line-in:#d9d8e4; --chip:#f1f0f6; --seg:#e9e8f1; --zero:#f7f7fa;
  --acc:#6a45f5; --accInk:#ffffff; --accSoft:#eeeafe; --accent:#5230dd; --lime:#6a45f5;
  --ok:#127a4b; --okSoft:#e3f6ec; --info:#2a66d1; --infoSoft:#e6effc; --warnC:#9a5706; --warnSoft:#fcf0dc; --danger:#c22b2b; --badSoft:#fde8e8;
  --demo:#fff4c2; --demoInk:#5b4a00; --img1:#e2dcff; --img2:#b9a8ff; --imgInk:#2b1d73;
  --shadow:0 1px 2px rgba(26,24,48,.05),0 8px 24px rgba(26,24,48,.06);
  --heroImgBg:#f2f3f9; --heroImgFilter:none; --heroImgRing:transparent; --heroLt:block; --heroDk:none; --artFilter:none; --artRing:transparent;
  --font:Rubik,Heebo,system-ui,sans-serif; --mono:Rubik,Heebo,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0c0b12; --bg:#12111a; --card:#1c1b27; --ink:#f1f0f7; --muted:#aaa7bd; --muted2:#aaa7bd; --muted3:#a09db3;
    --line:#2d2b3b; --line-in:#3a3849; --chip:#262433; --seg:#232130; --zero:#181722;
    --acc:#9c85ff; --accInk:#140f2c; --accSoft:#2a2346; --accent:#bba9ff; --lime:#9c85ff;
    --ok:#5bd19a; --okSoft:#163027; --info:#86b2ff; --infoSoft:#1a2740; --warnC:#f2b65a; --warnSoft:#33270f; --danger:#ff8f8f; --badSoft:#3a1c1f;
    --demo:#3a3410; --demoInk:#f3e39a; --img1:#2a2346; --img2:#3d3170; --imgInk:#e4dcff;
    --shadow:0 0 0 1px #2d2b3b; --heroImgFilter:none; --heroImgRing:transparent; --heroLt:none; --heroDk:block; --heroImgBg:#12111a; --artFilter:brightness(.9); --artRing:#3a3849;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0c0b12; --bg:#12111a; --card:#1c1b27; --ink:#f1f0f7; --muted:#aaa7bd; --muted2:#aaa7bd; --muted3:#a09db3;
  --line:#2d2b3b; --line-in:#3a3849; --chip:#262433; --seg:#232130; --zero:#181722;
  --acc:#9c85ff; --accInk:#140f2c; --accSoft:#2a2346; --accent:#bba9ff; --lime:#9c85ff;
  --ok:#5bd19a; --okSoft:#163027; --info:#86b2ff; --infoSoft:#1a2740; --warnC:#f2b65a; --warnSoft:#33270f; --danger:#ff8f8f; --badSoft:#3a1c1f;
  --demo:#3a3410; --demoInk:#f3e39a; --img1:#2a2346; --img2:#3d3170; --imgInk:#e4dcff;
  --shadow:0 0 0 1px #2d2b3b; --heroImgFilter:none; --heroImgRing:transparent; --heroLt:none; --heroDk:block; --heroImgBg:#12111a; --artFilter:brightness(.9); --artRing:#3a3849;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font-family:inherit}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media (min-width:600px){.app{box-shadow:0 30px 80px rgba(26,24,48,.16);margin:16px auto;min-height:calc(100vh - 96px);border-radius:28px;overflow:hidden}}

/* פס ההדגמה בייצור (ממצא 1, הכרעה 2) */
.demo-bar{background:var(--demo);color:var(--demoInk);font-size:12px;padding:5px 16px;text-align:center}

/* הכותרת, קומפקטית (אבחון: חמישית מהמסך): חזרה עם חץ ימינה (ממצא 38), ומצב כהה כאייקון שנשמר (27) */
header.hd{padding:12px 18px 2px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hd-main{flex:1;min-width:0}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);background:none;border:0;font-size:14px;font-weight:500;min-height:36px;padding:0;cursor:pointer}
.theme{width:44px;height:44px;flex:none;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;cursor:pointer;color:var(--ink);padding:0}
.eyebrow{font-size:12px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between;gap:8px}
.sid{color:var(--muted3);font-size:10px;font-variant-numeric:tabular-nums}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:2px 0 0;text-wrap:balance}
h2{font-size:16px;font-weight:700;margin:6px 0 0}
main{flex:1;padding:12px 16px 28px;display:flex;flex-direction:column;gap:12px;animation:enter .28s ease}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main{animation:none}}

/* פריסה */
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sechd{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.sechd h2{margin:0}
.muted{color:var(--muted)} .small{font-size:12.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.divider{border-top:1px solid var(--line);padding-top:8px}

/* אייקון בעיגול צבעוני: הצבע אומר את סוג המידע (אבחון: "נראית בסיסית") */
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--accSoft);color:var(--accent)}
.ic.ok{background:var(--okSoft);color:var(--ok)} .ic.info{background:var(--infoSoft);color:var(--info)}
.ic.warn{background:var(--warnSoft);color:var(--warnC)} .ic.bad{background:var(--badSoft);color:var(--danger)}

/* כרטיסים: לבן, צל רך, בלי מסגרת */
.card{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.hero{background:var(--acc);color:var(--accInk);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.hero .sub{color:var(--accInk);opacity:.85;font-size:12.5px}
.hero .lead{font-size:18px;font-weight:600}
.hero .num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.hero .cap{font-size:11px;opacity:.85}
.stat{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.stat .lead{font-size:16px;font-weight:600}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.coins{display:flex;flex-direction:column;align-items:center;padding:8px 14px;border-radius:16px;background:var(--accSoft);color:var(--accent);min-width:76px}
.coins .num{font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.coins .cap{font-size:12px}
.tile{background:var(--card);border:0;border-radius:18px;padding:12px;text-align:right;color:var(--ink);font-size:14px;width:100%;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
button.tile{cursor:pointer}
.tile .lbl{font-size:12.5px;font-weight:500;color:var(--ink)}
.tile .num{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;order:-1}
.tile .ic{order:-2;margin-bottom:4px}
.tile .cap{font-size:12px;color:var(--muted)}
.tile.zero{background:var(--zero);box-shadow:none;border:1px solid var(--line)}
.tile.zero .num{color:var(--muted);font-size:22px}
.tile.zero .ic{background:transparent;color:var(--muted);border:1px solid var(--line)}
.item{background:var(--card);border:0;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;text-align:right;width:100%;color:inherit;font-size:14px;min-height:56px;box-shadow:var(--shadow)}
button.item{cursor:pointer}
button.item:hover{box-shadow:var(--shadow),0 0 0 1px var(--line-in)}
.item .grow{flex:1;min-width:0}
.item .t{font-size:15px;font-weight:500}
.item .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.chev{flex:none;color:var(--muted3);display:inline-flex}
/* פס צבע בצד הכרטיס, לפי סוג המידע; אחרי הכרטיסים, כי border:0 שלהם היה מבטל אותו */
.stripe{border-inline-start:5px solid var(--sc,var(--acc))}
.stripe.ok{--sc:var(--ok)} .stripe.info{--sc:var(--info)} .stripe.warn{--sc:var(--warnC)} .stripe.bad{--sc:var(--danger)}
.when{width:56px;flex:none;background:var(--accSoft);color:var(--accent);border-radius:12px;padding:6px 4px;text-align:center}
.when .h{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.when .d{font-size:11px;margin-top:1px}
.meta{display:flex;flex-direction:column;gap:4px}
.meta>span{display:flex;align-items:center;gap:6px}
.meta svg{color:var(--muted3)}
.av{width:38px;height:38px;border-radius:50%;background:var(--accSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.tintrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;width:100%;border:0;text-align:right;color:var(--ink);font-size:14px;cursor:pointer;box-shadow:var(--shadow)}
.notice{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border-inline-start:5px solid var(--info)}
.card .notice{box-shadow:none;background:var(--zero)} /* בתוך כרטיס, הודעה אינה כרטיס שני */
.warnbox{background:var(--warnSoft);border-radius:18px;padding:12px 14px;color:var(--ink)}
.confirm{background:var(--warnSoft);border-radius:18px;padding:14px 16px}

/* התקדמות: טבעת ומד (אבחון: "חסרה תחושת התקדמות") */
.ring{flex:none}
.ring .tr{stroke:var(--line)} .ring .fg{stroke:var(--acc)} .ring.full .fg{stroke:var(--ok)}
.ring text{fill:var(--ink);font-family:var(--font);font-weight:700;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s ease}
.meter.full span{background:var(--ok)}
@media (prefers-reduced-motion:reduce){.meter span{transition:none}}

/* תמונות דקורטיביות */
.img{height:170px;border-radius:20px;background:linear-gradient(135deg,var(--img1),var(--img2));display:flex;align-items:flex-end;padding:12px;color:var(--imgInk);font-size:11px}
.img.tall{height:230px}
.img.short{height:120px}
/* תמונת הכניסה (גרסה 4): 3D רך, בצבעי הכיוון, בגרסה בהירה ובגרסה כהה שמתחלפות לפי מצב התצוגה. שני גדלים (860 ו-1290) לחדות בטלפון */
.hero-img{width:100%;height:auto;aspect-ratio:860/498;object-fit:cover;border-radius:20px;background:var(--heroImgBg);filter:var(--heroImgFilter);box-shadow:0 0 0 1px var(--heroImgRing)}
.hero-img.lt{display:var(--heroLt)} .hero-img.dk{display:var(--heroDk)}
/* כל האיורים (גרסה 4): ביחס המלא, בלי חיתוך. איור שעוד אין לו גרסה כהה: במצב כהה בכרטיס ממוסגר ומעט מעומעם */
.hero-img.nodark{display:block;filter:var(--artFilter);box-shadow:0 0 0 1px var(--artRing)}
.state .hero-img{border-radius:14px}

/* תגיות בלי שבירה ובלי מתיחה (ממצא 33) */
.badge{display:inline-block;flex:none;align-self:center;white-space:nowrap;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);color:var(--ink);font-variant-numeric:tabular-nums}
.badge.ok{background:var(--okSoft);color:var(--ok)}
.badge.acc{background:var(--accSoft);color:var(--accent)}
.badge.warn{background:var(--warnSoft);color:var(--warnC)}
.badge.demo{background:var(--demo);color:var(--demoInk)}

/* כפתורים: מצב "שולח" (16), שטח לחיצה 44 (26), כפתור קטן בלי גובה קבוע (13) */
.btn{min-height:50px;width:100%;border-radius:14px;border:0;background:var(--acc);color:var(--accInk);font-size:16px;font-weight:600;cursor:pointer;padding:0 18px;box-shadow:0 6px 16px rgba(106,69,245,.22)}
.btn.sec{background:var(--card);border:1px solid var(--line-in);color:var(--ink);box-shadow:none}
.btn.small{min-height:38px;width:auto;padding:6px 16px;font-size:13.5px;border-radius:12px}
.btn:disabled{opacity:.55;cursor:progress}
.btn:focus-visible,.item:focus-visible,.pill:focus-visible,.tile:focus-visible,.link:focus-visible,.tintrow:focus-visible,.check:focus-visible,.theme:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13.5px;font-weight:500;padding:0 4px;min-height:44px;display:inline-flex;align-items:center;gap:4px}

/* טפסים: תווית מקושרת לשדה (18), מייל וקישור משמאל לימין (8) */
input,select,textarea{width:100%;font-size:15px;padding:11px 12px;border-radius:12px;border:1px solid var(--line-in);background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
textarea{resize:vertical;line-height:1.45}
input[type=email],input[type=url],input.ltr{direction:ltr;text-align:left}
input[type=email]::placeholder,input[type=url]::placeholder{text-align:left}
label{font-size:12.5px;color:var(--muted2);display:block;margin-bottom:4px}
.checkline{display:flex;align-items:center;gap:10px;min-height:44px}
.checkline input{width:20px;height:20px;accent-color:var(--acc)}
.seg{display:flex;background:var(--seg);border-radius:999px;padding:3px;gap:4px}
.seg button{flex:1;height:36px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.pill{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-in);background:var(--card);cursor:pointer;font-size:13px;color:var(--ink)}
.pill.on{background:var(--acc);color:var(--accInk);border-color:transparent}
/* סטים: מה שבוצע ירוק ומלא, מה שנשאר לבן עם מסגרת מקווקוות (אבחון: S14 צפוף) */
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;align-items:center}
.setrow.head{padding:0 8px}
.setrow.done,.setrow.todo{padding:6px 8px;border-radius:14px}
.setrow.done{background:var(--okSoft)}
.setrow.todo{outline:1.5px dashed var(--line-in);outline-offset:-1.5px}
.setrow .n{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.setrow input{padding:9px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.check{width:44px;height:44px;border-radius:12px;border:2px solid var(--line-in);background:var(--card);cursor:pointer;color:transparent;display:grid;place-items:center;padding:0}
.check.on,.check[aria-pressed=true]{background:var(--ok);color:var(--card);border-color:transparent}
.status{border:0;background:none;min-height:44px;padding:0 4px;font-size:13px;cursor:pointer;color:var(--muted3)}
.status[aria-pressed=true]{color:var(--ok);font-weight:600}
.exline{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
.setchip{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-size:12.5px;background:var(--chip);border-radius:8px;padding:3px 8px;white-space:nowrap}
.linkbox{direction:ltr;text-align:left;font-size:12.5px;background:var(--chip);border-radius:12px;padding:10px 12px;word-break:break-all}

/* מצבים: טוען (6), שגיאה עם "לנסות שוב" (2), ריק (30) */
.skel{background:var(--card);border-radius:18px;height:64px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--chip),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.skel::after{animation:none}}
.state{background:var(--card);border:1.5px dashed var(--line-in);border-radius:18px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.state .t{font-size:15px;font-weight:600}
.state .s{font-size:13px;color:var(--muted)}
.state.err .t{color:var(--danger)}

/* רגע של חגיגה בסיום אימון (S15; אבחון: "אין רגע של חגיגה") */
.celebrate{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px;text-align:center}
.celebrate .badgeic{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;background:var(--accSoft);color:var(--accent);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.celebrate .badgeic{animation:none}}

/* וידאו וגרף */
.video{background:#14112a;color:#fff;border-radius:20px;height:170px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;text-align:center;padding:12px}
svg.chart text{fill:var(--muted2);font-size:10.5px;font-family:var(--font)}

/* סרגל הלשוניות עם אייקונים (26); הלשונית הפעילה בגלולה סגולה; לא פעילה בניגודיות תקינה (17) */
nav.tabs{position:sticky;bottom:0;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));display:flex;background:var(--card);border-top:1px solid var(--line)}
nav.tabs button{flex:1;padding:4px 4px 6px;border:0;background:none;color:var(--muted3);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;border-radius:12px}
nav.tabs button .pi{padding:4px 16px;border-radius:999px;display:grid;place-items:center}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs button.on .pi{background:var(--accSoft)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;z-index:5}
.toast.show{opacity:1;transform:translate(-50%,-8px)}

/* כלי אב הטיפוס, מחוץ לאפליקציה */

function streak(tid){
  const days=[...new Set(results.filter(r=>r.tid===tid).map(r=>r.date.toDateString()))].map(s=>new Date(s)).sort((a,b)=>b-a);
  if(!days.length)return 0;
  if((new Date(TODAY.toDateString())-days[0])/864e5>ref.streakGapDays)return 0;
  let n=1; for(let i=1;i<days.length;i++){ if((days[i-1]-days[i])/864e5<=ref.streakGapDays)n++; else break;} return n;
}

   <div class="row"><span class="ic">${I.users}</span><div><div class="mono" style="font-size:22px;font-weight:700;line-height:1">${trainees.filter(t=>t.joined).length}</div><div class="muted small">מתאמנים פעילים</div></div></div></div>
  <h2>דורש תשומת לב</h2>
  <div class="grid2">
   ${tile('תשלומים פתוחים',open,open?'לצפייה ברשימה':'הכול שולם','go','paymentsCoach','','card','warn')}
   ${tile('בקשות ביטול חריגות',pendLate,pendLate?'ממתינות להחלטה':'אין בקשות','go','classesCoach','','xcal','bad')}
   ${tile('תגמולים לאספקה',pendRed,pendRed?'ממתינים לך':'אין ממתינים','go','rewardsCoach','','gift','')}
   ${tile('שיעורים היום',todayCls.length,todayCls.length?'לרשימת הנרשמים':'אין היום','go','classesCoach','','cal','info')}
  </div>
  <button class="tintrow" data-a="go" data-v="challengeCoach"><span class="ic warn">${I.trophy}</span><span class="grow" style="flex:1"><span class="muted small" style="display:block">האתגר השבועי:</span><b>${challenge.name}</b></span><span class="badge ok">${challenge.completions.length} השלימו</span></button>`,{backBtn:false});
};

/* ----- S02 מתאמנים והזמנה ----- */
screens.trainees=()=>shell('המתאמנים שלי','מתאמנים',`
  <div class="list">${trainees.map(t=>`<${t.joined?'button':'div'} class="item" ${t.joined?`data-a="go" data-v="traineeCard" data-p="${t.id}"`:''}>
    <span class="av">${ini(t.name)}</span><div class="grow"><div class="t">${nm(t.name)}</div><div class="s">${t.joined?(programs[t.id]?'יש תוכנית':'אין תוכנית'):'ההזמנה נשלחה'}</div></div>
    ${t.joined?chev:'<span class="badge warn">הוזמן, טרם הצטרף</span>'}</${t.joined?'button':'div'}>`).join('')}</div>
  <button class="btn" data-a="go" data-v="invite">הזמנת מתאמן</button>`,{backBtn:false});

screens.invite=()=>shell('מתאמן חדש','הזמנת מתאמן',`
  ${field('שם המתאמן','<input id="invName" placeholder="לדוגמה: דנה" autocomplete="off">')}
  ${field('מייל (לשליחת ההזמנה)','<input id="invMail" type="email" placeholder="name@example.com">')}
  <button class="btn" data-a="sendInvite" data-v="mail">שליחת הזמנה במייל</button>
  <button class="btn sec" data-a="sendInvite" data-v="link">יצירת קישור לשיתוף (למשל בוואטסאפ)</button>
  <div class="muted small">ההזמנה בתוקף ${ref.inviteValidDays} ימים, לפי ההגדרות.</div>`);

// הקישור מוצג במסך, עם שיתוף והעתקה (ממצא 5). נפתח גם מהרשימה, להזמנה שטרם מומשה.
screens.inviteDone=({id})=>{const t=trainees.find(x=>x.id===id);return shell('הזמנת מתאמן',nm(t.name),`
  <div class="notice">הקישור מוכן. אפשר לשלוח אותו בוואטסאפ או בכל דרך אחרת.</div>
  <div class="linkbox" id="invLink">${t.invite.link}</div>
  <div class="grid2"><button class="btn" data-a="shareInvite" data-p="${id}">שיתוף</button><button class="btn sec" data-a="copyInvite" data-p="${id}">העתקה</button></div>
  <div class="muted small">ההזמנה בתוקף ${ref.inviteValidDays} ימים, לפי ההגדרות.</div>`)}; // נפתח רק אחרי יצירת קישור (פער 5, הכרעת הצוות)

/* ----- S03 כרטיס מתאמן ----- */
screens.traineeCard=({id})=>{
  const t=trainees.find(x=>x.id===id); const p=programs[id];
  const pays=payments.filter(x=>x.tid===id); const openN=pays.filter(x=>x.status==='פתוחה').length;
  const g=goals[id];
  return shell('כרטיס מתאמן',nm(t.name),`
  <div class="grid3">
   ${tile('מטבעות',num(balance(id)))}
   ${tile('רצף',streak(id))}
   ${tile('לתשלום',openN)}
  </div>
  <div class="list">
   <button class="item" data-a="go" data-v="programEdit" data-p="${id}"><div class="grow"><div class="t">תוכנית אימון</div><div class="s">${p?p.workouts.length+' אימונים':'טרם נבנתה'}</div></div>${chev}</button>
   <button class="item" data-a="go" data-v="progress" data-p="${id}"><div class="grow"><div class="t">התקדמות וגרף</div></div>${chev}</button>
   <button class="item" data-a="go" data-v="resultsCoach" data-p="${id}"><div class="grow"><div class="t">אימונים שבוצעו והערות</div></div>${chev}</button>
   <button class="item" data-a="go" data-v="paymentsCoach" data-p="${id}"><div class="grow"><div class="t">תשלומים וחשבוניות</div><div class="s">${pays.length} בקשות</div></div>${openN?'<span class="badge warn">לתשלום</span>':chev}</button>
   <button class="item" data-a="go" data-v="goalEdit" data-p="${id}"><div class="grow"><div class="t">יעד אישי</div><div class="s">${g?`${ex(g.ex).name} ${g.value} ק"ג · ${g.status}`:'אין יעד'}</div></div>${chev}</button>
  </div>`);
};

/* ----- S04 תוכנית אימון (מקרה שימוש 1) ----- */
screens.programEdit=({id})=>{
  const p=programs[id];
  if(!p) return shell(nm(tname(id)),'בניית תוכנית',`
    ${empty('למתאמן עוד אין תוכנית','התוכנית מתחילה באימון אחד, ואפשר להוסיף עוד.',art('empty-plan',true))}
    <button class="btn" data-a="newProgram" data-p="${id}">בניית תוכנית חדשה</button>`);
  const inactive=(inactivePrograms[id]||[]);
  return shell(nm(tname(id)),'תוכנית אימון',`
  ${p.workouts.map((w,wi)=>`<div class="card col"><div class="row between"><b>${w.name}</b><button class="link" data-a="addItem" data-p="${id}|${wi}">+ תרגיל</button></div>
    ${w.items.length?w.items.map((it,ii)=>`<div class="row between divider">
      <div><div>${ex(it.ex).name} ${ex(it.ex).video?'<span class="badge">סרטון</span>':''}</div>
      <div class="muted small mono">${it.sets} סטים · ${it.reps} חזרות · ${it.weight?it.weight+' ק"ג':'משקל גוף'}</div></div>
      <button class="btn sec small" data-a="go" data-v="swap" data-p="${id}|${wi}|${ii}">החלפה</button></div>`).join(''):'<div class="muted small divider">עוד אין תרגילים באימון הזה.</div>'}
  </div>`).join('')}
  <button class="btn sec" data-a="addWorkout" data-p="${id}">+ אימון נוסף</button>
  <button class="btn" data-a="saveProgram" data-p="${id}">שמירה</button>
  ${S.params.confirmNew===id?`<div class="confirm col" role="alertdialog" aria-label="אישור תוכנית חדשה"><b>התוכנית הנוכחית תישמר כלא פעילה. להמשיך?</b>
    <div class="row"><button class="btn small" data-a="newProgram" data-p="${id}">כן, תוכנית חדשה</button><button class="btn sec small" data-a="cancelNew">ביטול</button></div></div>`
   :`<button class="btn sec" data-a="askNew" data-p="${id}">בניית תוכנית חדשה במקום הזו</button>`}
  ${inactive.length?`<div class="muted small">תוכניות קודמות (לא פעילות): ${inactive.map(x=>x.name+' מ-'+fmtY(x.from)).join(', ')}</div>`:''}`);
};

screens.swap=({id})=>{
  const [tid,wi,ii]=id.split('|'); const it=programs[tid].workouts[wi].items[ii];
  return shell('החלפת תרגיל',ex(it.ex).name,`
  <div class="muted">התרגיל החדש ייכנס לאותו מקום בסדר. התוצאות של התרגיל הקודם נשארות בהיסטוריה.</div>
  <div class="list">${exercises.filter(e=>e.id!==it.ex).map(e=>`<button class="item" data-a="doSwap" data-p="${id}|${e.id}"><div class="grow"><div class="t">${e.name}</div><div class="s">${e.video?'יש סרטון':'אין סרטון'}</div></div>${chev}</button>`).join('')}</div>
  <button class="btn sec" data-a="go" data-v="exerciseNew">+ תרגיל חדש משלי</button>`);
};

screens.itemTarget=({id})=>{
  const [tid,wi,ii]=id.split('|'); const it=programs[tid].workouts[wi].items[ii];
  return shell('יעד לתרגיל',ex(it.ex).name,`
  <div class="grid3">${field('סטים',`<input id="tS" type="number" inputmode="numeric" value="${it.sets}">`)}
  ${field('חזרות',`<input id="tR" type="number" inputmode="numeric" value="${it.reps}">`)}
  ${field('משקל (ק"ג)',`<input id="tW" type="number" inputmode="decimal" value="${it.weight}">`)}</div>
  <div class="muted small">בתרגיל משקל גוף, משאירים משקל 0.</div>
  <button class="btn" data-a="saveTarget" data-p="${id}">שמירת היעד</button>`);
};

/* ----- S05 תרגילים וסרטונים (מקרה שימוש 10) ----- */
screens.exercises=()=>shell('רשימת התרגילים','תרגילים',`
  <div class="list">${exercises.map(e=>`<button class="item" data-a="go" data-v="exercise" data-p="${e.id}"><div class="grow"><div class="t">${e.name}</div><div class="s">${e.prep?'מהרשימה המוכנה · ':''}${e.video==='youtube'?'קישור יוטיוב':e.video==='upload'?'סרטון שהועלה':'אין סרטון'}</div></div>${chev}</button>`).join('')}</div>
  <button class="btn" data-a="go" data-v="exerciseNew">+ תרגיל חדש</button>`);

screens.exerciseNew=()=>shell('תרגיל חדש','הוספת תרגיל',`
  ${field('שם התרגיל','<input id="exName" placeholder="לדוגמה: פרפר">')}
  <label class="checkline" for="exBody"><input type="checkbox" id="exBody"><span style="font-size:14px;color:var(--ink)">תרגיל משקל גוף</span></label>
  <button class="btn" data-a="addExercise">שמירה</button>`);

screens.exercise=({id})=>{const e=ex(id);if(e.prep)return shell('מהרשימה המוכנה',e.name,`
  <div class="video">▶︎ סרטון הדגמה מיוטיוב (קישור לדוגמה)</div>
  <div class="muted small">התרגיל מהרשימה המוכנה, והסרטון שלו משותף לכל המאמנים בעסק. לסרטון משלך אפשר ליצור תרגיל חדש.</div>`);return shell('תרגיל',e.name,`
  ${e.video?`<div class="video">▶︎ ${e.video==='youtube'?'סרטון הדגמה מיוטיוב (קישור לדוגמה)':'סרטון שהמאמן העלה (דוגמה)'}</div>`:empty('לתרגיל עוד אין סרטון','אפשר לצרף קישור או להעלות מהטלפון.')}
  <div class="muted small">הסרטון שייך לתרגיל, ומופיע בכל התוכניות שבהן התרגיל נמצא.</div>
  ${field('קישור לסרטון','<input id="vidLink" type="url" placeholder="https://www.youtube.com/...">')}
  <button class="btn sec" data-a="attachLink" data-p="${id}">צירוף קישור</button>
  <button class="btn sec" data-a="uploadOk" data-p="${id}" data-busy="מעלה...">העלאת סרטון מהטלפון (${videoLimit()})</button>
  <button class="link" data-a="uploadLong">מה קורה בסרטון ארוך יותר?</button>`)};

/* ----- S07 יעד אישי: נפתח על היעד הקיים (ממצא 4) ----- */
screens.goalEdit=({id})=>{const g=goals[id]||{ex:'e1',value:'',status:'חדש'};return shell(nm(tname(id)),'יעד אישי',`
  ${goals[id]?`<div class="notice small">היעד הנוכחי: ${ex(g.ex).name} ${g.value} ק"ג · ${g.status}. שמירה כאן מחליפה אותו.</div>`:''}
  ${field('תרגיל',`<select id="gEx">${exercises.filter(e=>!e.body).map(e=>`<option value="${e.id}" ${e.id===g.ex?'selected':''}>${e.name}</option>`).join('')}</select>`)}
  ${field('משקל יעד (ק"ג)',`<input id="gVal" type="number" inputmode="decimal" value="${g.value}">`)}
  <div class="muted small">כשהמתאמן עובר את היעד מתקבלים ${ref.coins.goal} מטבעות, והיעד נסגר עד שיוגדר יעד חדש.</div>
  <button class="btn" data-a="saveGoal" data-p="${id}">שמירת היעד</button>`)};

/* ----- S06 תוצאות והערות מאמן (מקרי שימוש 3, 6) ----- */
function groupWorkouts(tid){const byW={};results.filter(r=>r.tid===tid).forEach(r=>{const k=r.date.toDateString()+r.wid;(byW[k]=byW[k]||{date:r.date,wid:r.wid,rows:[]}).rows.push(r)});return Object.entries(byW).sort((a,b)=>b[1].date-a[1].date)}
const wName=wid=>{for(const p of Object.values(programs))if(p)for(const w of p.workouts)if(w.id===wid)return w.name;return 'אימון'};
screens.resultsCoach=({id})=>{
  const list=groupWorkouts(id);
  return shell(nm(tname(id)),'אימונים שבוצעו',`
  ${list.length?list.map(([k,w])=>`<div class="card col"><div class="row between"><b>${fmtDay(w.date)} · ${wName(w.wid)}</b>${w.rows.some(r=>r.corrected)?'<span class="badge warn">תוקן</span>':''}</div>
   ${w.rows.map(r=>exLine(r)).join('')}
   ${notes[k]?`<div class="notice small">ההערה שלך: ${notes[k]}</div>`:`<button class="link" data-a="go" data-v="noteAdd" data-p="${id}|${k}">+ הערה אישית</button>`}
  </div>`).join(''):empty('עוד אין אימונים שבוצעו','האימונים יופיעו כאן אחרי שהמתאמן ישמור אותם.')}`);
};
screens.noteAdd=({id})=>shell('הערה אישית','הערה לאימון',`
  ${field(`ההערה (עד ${ref.noteMax} תווים)`,`<textarea id="noteTxt" rows="4" maxlength="${ref.noteMax}" placeholder="לדוגמה: שיא יפה בסקוואט, בשבוע הבא ננסה 67.5"></textarea>`)}
  <button class="btn" data-a="saveNote" data-p="${id}">שמירה</button>`);

/* ----- S08 תשלומים (מקרה שימוש 2) ----- */
screens.paymentsCoach=({id})=>{
  const list=payments.filter(p=>!id||p.tid===id).sort((a,b)=>b.date-a.date);
  return shell('הדגמה, לא מתבצע חיוב',id?`תשלומים · ${nm(tname(id))}`:'תשלומים וחשבוניות',`
  <div class="list">${list.length?list.map(p=>`<div class="item"><div class="grow"><div class="t">${nm(tname(p.tid))} · ${payLabel[p.type]}</div><div class="s"><span class="mono">₪${num(p.amount)}</span> · ${fmtY(p.date)}</div></div>
   ${p.status==='שולמה'?`<button class="btn sec small" data-a="go" data-v="invoice" data-p="${p.id}">חשבונית ${p.invoice}</button>`:'<span class="badge warn">פתוחה</span>'}</div>`).join(''):empty('עוד אין בקשות תשלום')}</div>
  <button class="btn" data-a="go" data-v="payRequest" data-p="${id||''}">בקשת תשלום חדשה</button>`);
};
screens.payRequest=({id})=>shell('הדגמה, לא מתבצע חיוב','בקשת תשלום',`
  ${field('מתאמן',`<select id="prT">${trainees.filter(t=>t.joined).map(t=>`<option value="${t.id}" ${t.id===id?'selected':''}>${t.name}</option>`).join('')}</select>`)}
  ${field('סוג התשלום',`<select id="prType"><option value="monthly">מנוי חודשי · ₪${num(ref.prices.monthly)}</option><option value="pack10">חבילת 10 אימונים (כרטיסייה) · ₪${num(ref.prices.pack10)}</option></select>`)}
  <div class="muted small">המחירים מגיעים מההגדרות. הכרטיסייה בגרסה הראשונה היא סוג תשלום בלבד, ואינה סופרת אימונים.</div>
  <button class="btn" data-a="createPayReq">שליחת בקשת תשלום</button>`);
screens.invoice=({id})=>{const p=payments.find(x=>x.id===id);return shell('הדגמה, אינה חשבונית מס','חשבונית '+p.invoice,`
  <div class="card col"><span class="badge demo" style="align-self:flex-start">הדגמה, אינה חשבונית מס</span>
   <div class="row between"><span class="muted">מספר</span><span class="mono">${p.invoice}</span></div>
   <div class="row between"><span class="muted">לקוח</span><span>${nm(tname(p.tid))}</span></div>
   <div class="row between"><span class="muted">עבור</span><span>${payLabel[p.type]}</span></div>
   <div class="row between"><span class="muted">סכום</span><span class="mono">₪${num(p.amount)}</span></div>
   <div class="row between"><span class="muted">תאריך</span><span class="mono">${fmtY(p.date)}</span></div></div>`)};

/* ----- S09 אתגר שבועי (מקרה שימוש 8) ----- */
screens.challengeCoach=()=>shell(`שבוע ${fmt(challenge.start)} עד ${fmt(challenge.end)}`,'אתגר שבועי',`
  <div class="hero"><div class="sub">האתגר של השבוע</div><div class="lead" style="margin-top:4px">${challenge.name}</div><div class="sub" style="margin-top:4px">פרס: ${ref.coins.challenge} מטבעות${challenge.prize?' + '+challenge.prize:''}</div></div>
  <h2>השלימו</h2>
  <div class="list">${challenge.completions.map(c=>`<div class="item"><span class="av">${ini(tname(c.tid))}</span><div class="grow t">${nm(tname(c.tid))}</div>${c.delivered?'<span class="badge ok">הפרס נמסר</span>':`<button class="btn sec small" data-a="prizeDelivered" data-p="${c.tid}">סימון מסירת פרס</button>`}</div>`).join('')||empty('עוד אף אחד לא השלים')}</div>
  <button class="btn sec" data-a="go" data-v="challengeEdit">שינוי אתגר</button>
  <div class="muted small">האתגר הבא אפשר לפרסם מיום ראשון, ${fmt(addDays(challenge.end,1))}.</div>`);
/* S09 שינוי אתגר (מפה גרסה 13, כלל 11; usecase-08 גרסה 3): השם והפרס תמיד; היעד רק לפני השלמה ראשונה */
screens.challengeEdit=()=>{const locked=challenge.completions.length>0;return shell('אתגר השבוע','שינוי אתגר',`
  ${field('שם',`<input id="chEName" value="${challenge.name}">`)}
  ${field('פרס נוסף (לא חובה)',`<input id="chEPrize" value="${challenge.prize||''}">`)}
  ${locked?`<div class="row between"><span class="muted">יעד</span><span class="mono">${challenge.type==='count'?num(challenge.target)+' אימונים':num(challenge.target)+' ק"ג'}</span></div>
  <div class="notice small">כבר יש מי שהשלים את האתגר, ולכן אפשר לשנות רק את השם ואת הפרס. המטבעות שכבר ניתנו נשארים.</div>`
  :field('ערך היעד',`<input id="chETarget" type="number" inputmode="numeric" value="${challenge.target}">`)}
  <button class="btn" data-a="saveChallenge">שמירת השינוי</button>`)}; // אתגר אחד בשבוע: בלי "הוספה" כשיש אתגר (הכרעת הצוות, 30.09.2026)
screens.challengeNew=()=>shell('אתגר אחד בשבוע','הוספת אתגר',`
  ${field('שם','<input id="chName" value="חמישה אימונים השבוע">')}

  <div class="list">${up.length?up.map(c=>classRow(c,c.date<new Date(TODAY.toDateString())?'<span class="badge">עבר</span>':c.cancelled?'<span class="badge warn">בוטל</span>':chev,'go',c.id)).join(''):empty('אין שיעורים קרובים','שיעור שמתפרסם מופיע כאן ואצל המתאמנים.')}</div>

/* ================= בעל העסק (מקרה שימוש 12) ================= */
const paidIn=(from,to)=>payments.filter(p=>p.status==='שולמה'&&p.date>=from&&p.date<to).reduce((a,p)=>a+p.amount,0);
const coachIncome=id=>{const k=coaches.find(x=>x.id===id);return payments.filter(p=>p.status==='שולמה'&&k.trainees.includes(p.tid)).reduce((a,p)=>a+p.amount,0)};

/* ----- S24 סקירה עסקית ----- */
screens.ownerHome=()=>{
  const mStart=new Date(TODAY.getFullYear(),TODAY.getMonth(),1), mNext=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,1);
  const income=paidIn(mStart,mNext), paidN=payments.filter(p=>p.status==='שולמה'&&p.date>=mStart&&p.date<mNext).length;
  const open=payments.filter(p=>p.status==='פתוחה'); const openSum=open.reduce((a,p)=>a+p.amount,0);
  const wk=classes.filter(c=>!c.cancelled&&c.date>=weekStart&&c.date<=addDays(weekStart,6));
  const reg=wk.reduce((a,c)=>a+c.reg.length,0), cap=wk.reduce((a,c)=>a+c.cap,0);
  return shell(`${greeting()} · ${fmtDay(TODAY)}`,'העסק שלי',`
  <div class="hero row between"><div><div class="sub">הכנסות החודש (הדגמה)</div><div class="num" style="margin-top:3px">₪${num(income)}</div><div class="sub" style="margin-top:3px">${paidN} תשלומים ששולמו</div></div>
   <div style="text-align:center"><div class="num">${trainees.filter(t=>t.joined).length}</div><div class="cap">מתאמנים פעילים</div></div></div>
  <div class="grid2">
   ${tile('תשלומים פתוחים',open.length,open.length?`₪${num(openSum)} לגבייה`:'הכול שולם','','','','card','warn')}
   ${tile('מאמנים',coaches.filter(k=>k.joined).length,coaches.some(k=>!k.joined)?'יש הזמנה פתוחה':'לרשימה','tab','coaches','','users','')}
   ${tile('תפוסת שיעורים השבוע',cap?`${Math.round(reg/cap*100)}%`:'אין',`${reg}/${cap} מקומות`,'','','','cal','info')}
   ${tile('תגמולים לאספקה',redemptions.filter(r=>r.status==='ממתין לאספקה').length,'בידי המאמנים','','','','gift','')}
  </div>`,{backBtn:false});
};

/* ----- S25 מאמנים והזמנה, S27 כרטיס מאמן ----- */
screens.coaches=()=>shell('המאמנים בעסק','מאמנים',`
  <div class="list">${coaches.map(k=>`<${k.joined?'button':'div'} class="item" ${k.joined?`data-a="go" data-v="coachCard" data-p="${k.id}"`:''}>
    <span class="av">${ini(k.name)}</span><div class="grow"><div class="t">${nm(k.name)}</div><div class="s">${k.joined?`${k.trainees.length} מתאמנים`:'ההזמנה נשלחה'}</div></div>
    ${k.joined?chev:'<span class="badge warn">הוזמן, טרם הצטרף</span>'}</${k.joined?'button':'div'}>`).join('')}</div>

  return shell('כרטיס מאמן',nm(k.name),`
  <div class="grid3">${tile('מתאמנים',k.trainees.length,'','','','','users','')}${tile('הכנסות',`₪${num(coachIncome(id))}`,'','','','','card','ok')}${tile('שיעורים קרובים',cls,'','','','','cal','info')}</div>

/* ----- S26 מדדים (doc-okr-kpi.md). היעדים המספריים טרם נקבעו ----- */
screens.kpis=()=>{
  const act=trainees.filter(t=>t.joined).map(t=>t.id), n=act.length||1, pct=x=>`${Math.round(x/n*100)}%`;
  const withProg=act.filter(t=>programs[t]&&programs[t].active).length;
  const weekRes=act.filter(t=>results.some(r=>r.tid===t&&r.date>=addDays(TODAY,-7))).length;
  const chal=challenge.completions.length;
  const inv=payments.filter(p=>p.invoice).length, allPay=payments.length||1;
  const row=(t,v,s,kr)=>`<div class="item"><div class="grow"><div class="t">${t}</div><div class="s">${s} · ${kr} · יעד: טרם נקבע</div></div><span class="mono" style="font-size:18px">${v}</span></div>`;
  return shell('OKR ו-KPI','מדדים',`
  <div class="notice small">המטרה: המאמן מנהל את כל העבודה באפליקציה אחת, והמתאמנים נשארים ומתאמנים.</div>
  <div class="list">
   ${row('תוכניות פעילות לכל מתאמן',pct(withProg),`${withProg} מתוך ${act.length}`,'KR1')}
   ${row('תשלומים עם חשבונית',`${Math.round(inv/allPay*100)}%`,`${inv} מתוך ${payments.length}`,'KR1')}
   ${row('השתתפות באתגר השבועי',pct(chal),`${chal} מתוך ${act.length}`,'KR2')}
   ${row('הזנת תוצאות השבוע',pct(weekRes),`${weekRes} מתוך ${act.length}`,'KR3')}
  </div>
  <div class="muted small">מדדי הנטישה, הכניסות היומיות והמשוב דורשים נתוני כניסה שאינם באב הטיפוס.</div>`,{backBtn:false});
};

/* ----- עוד של בעל העסק ----- */

  const nextC=classes.filter(c=>!c.cancelled&&c.date>=new Date(TODAY.toDateString())&&c.reg.includes(me)).sort((a,b)=>a.date-b.date)[0];
  const cp=challengeProgress(me);
  const offers=classes.filter(c=>c.offer&&c.offer.tid===me);
  const msgs=inbox[me]||[];
  return shell(ref.reminder,`${greeting()}, ${nm(tname(me).replace(/\s*\(.*\)/,''))}`,`
  <div class="stat"><div class="row"><span class="ic">${I.flame}</span><div><div class="lead">רצף של ${streak(me)} אימונים</div><div class="sub">לא מתאפס עד ${ref.streakGapDays} ימים בין אימונים</div></div></div>
   <div class="coins"><span class="num">${num(balance(me))}</span><span class="cap">מטבעות</span></div></div>
  ${offers.map(c=>`<div class="notice col"><b>התפנה מקום!</b><div>בשיעור ב${fmtDay(c.date)} בשעה ${c.time}. המקום שמור לך ${ref.spotOfferHours} שעות.</div>

  ${msgs.map(m=>`<div class="notice col"><div class="row"><span class="ic info">${I.bell}</span><span style="flex:1">${m.text}</span></div><div class="row" style="justify-content:flex-end"><button class="link" data-a="markRead" data-p="${m.id}">סימון כנקרא</button></div></div>`).join('')}

  <button class="tintrow" data-a="go" data-v="challengeTrainee"><span class="ic warn">${I.trophy}</span><span style="flex:1"><span class="muted small" style="display:block">האתגר השבועי:</span><b>${challenge.name}</b></span>${cp.exempt?`<span class="muted small">${cpText(cp)}</span>`:ring(cp.value,cp.target,52,6,cp.value>=cp.target?'✓':undefined)}</button>`,{backBtn:false});

screens.workoutPick=()=>{const p=programs[S.me];return shell('התוכנית שלי','אימון',p?`
  <div class="list">${p.workouts.map(w=>`<button class="item" data-a="startWorkout" data-p="${w.id}"><div class="grow"><div class="t">${w.name}</div><div class="s">${w.items.map(i=>ex(i.ex).name).join(' · ')}</div></div>${chev}</button>`).join('')}</div>`
  :empty('התוכנית שלך עוד בהכנה אצל המאמן','היא תופיע כאן כשתהיה מוכנה.',art('empty-plan',true)),{backBtn:false})};

let draft=null;
screens.workout=({id})=>{
  const w=programs[S.me].workouts.find(x=>x.id===id);
  if(!draft||draft.wid!==id) draft={wid:id,items:w.items.map(it=>({ex:it.ex,sets:Array.from({length:it.sets},()=>({reps:it.reps,weight:it.weight,done:true}))}))};
  const allSets=draft.items.flatMap(it=>it.sets), doneN=allSets.filter(s=>s.done).length;
  return shell('ממולא לפי היעד · משנים רק מה ששונה',w.name,`

    <div class="row between"><div class="row" style="gap:8px"><b style="font-size:16px">${e.name}</b><span class="badge ${d===it.sets.length?'ok':'acc'}">${d}/${it.sets.length}</span></div>${e.video?`<button class="link" data-a="go" data-v="exerciseView" data-p="${e.id}">${I.play}סרטון הדגמה</button>`:''}</div>
    <div class="muted small">יעד: <span class="mono">${tgt.sets} סטים × ${tgt.reps}${tgt.weight?' · '+tgt.weight+' ק"ג':''}</span></div>
    <div class="setrow head muted small" aria-hidden="true"><span>סט</span><span>חזרות</span><span>${e.body?'':'משקל'}</span><span>בוצע</span></div>
    ${it.sets.map((s,si)=>`<div class="setrow ${s.done?'done':'todo'}"><span class="n">${si+1}</span>
      <input type="number" inputmode="numeric" aria-label="${e.name}, סט ${si+1}, חזרות" value="${s.reps}" data-set="${ii}|${si}|reps">
      ${e.body?'<span></span>':`<input type="number" inputmode="decimal" step="2.5" aria-label="${e.name}, סט ${si+1}, משקל" value="${s.weight}" data-set="${ii}|${si}|weight">`}
      <button class="check" data-a="toggleSet" data-p="${ii}|${si}" aria-pressed="${s.done}" aria-label="${e.name}, סט ${si+1} בוצע">${I.check}</button></div>`).join('')}
  </div>`}).join('')}
  <button class="btn" data-a="saveWorkout" data-busy="שומר...">שמירת האימון</button>`);
};

/* ----- S21 גרף התקדמות (מקרה שימוש 5): ציר זמן לפי תאריך, עד ארבע תוויות (ממצא 29) ----- */
screens.progress=({id})=>{
  const tid=id||S.me; const p=programs[tid];
  const exIds=[...new Set(results.filter(r=>r.tid===tid).map(r=>r.ex))];
  const planEx=p?p.workouts.flatMap(w=>w.items.map(i=>i.ex)).filter(x=>exIds.includes(x)):[];
  const sel=S.params.pex&&exIds.includes(S.params.pex)?S.params.pex:(planEx[0]||exIds[0]);
  if(!sel) return shell(nm(tname(tid)),'גרף התקדמות',empty('הגרף יופיע אחרי האימונים הראשונים','כל אימון שנשמר מוסיף נקודה.'));
  const pts=chartPoints(tid,sel); const e=ex(sel);
  const W=340,H=220,P=30; const vals=pts.map(x=>x.v); const mn=Math.min(...vals)*0.9, mx=Math.max(...vals)*1.05||1;
  const t0=+pts[0].date, t1=+pts[pts.length-1].date, span=(t1-t0)||1;
  const X=q=>pts.length>1?P+(W-2*P)*((+q.date-t0)/span):W/2; // ציר זמן לפי תאריך, הישן משמאל כמקובל בגרפים
  const Y=v=>H-P-(H-2*P)*((v-mn)/((mx-mn)||1));
  const best=Math.max(...vals); const bi=vals.lastIndexOf(best);
  const labelIdx=[...new Set([0,Math.round((pts.length-1)/3),Math.round(2*(pts.length-1)/3),pts.length-1])];
  const chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="גרף התקדמות ב${e.name}: שיא ${best}${e.body?' חזרות':' ק&quot;ג'}">
    <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line-in)"/>
    ${[1,2,3].map(k=>`<line x1="${P}" x2="${W-P}" y1="${P+(H-2*P)*(k-1)/3}" y2="${P+(H-2*P)*(k-1)/3}" stroke="var(--line)" stroke-dasharray="3 4"/>`).join('')}
    <polygon fill="var(--accSoft)" points="${X(pts[0])},${H-P} ${pts.map(q=>X(q)+','+Y(q.v)).join(' ')} ${X(pts[pts.length-1])},${H-P}"/>
    <polyline fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(q=>X(q)+','+Y(q.v)).join(' ')}"/>
    ${pts.map((q,i)=>`<circle cx="${X(q)}" cy="${Y(q.v)}" r="${i===bi?7:3.5}" fill="${i===bi?'var(--acc)':'var(--card)'}" stroke="var(--acc)" stroke-width="${i===bi?3:2}"/>`).join('')}
    ${labelIdx.map(i=>`<text x="${X(pts[i])}" y="${H-10}" text-anchor="middle">${fmt(pts[i].date)}</text>`).join('')}
    <text x="${X(pts[bi])}" y="${Y(best)-12}" text-anchor="middle">שיא ${best}</text></svg>`;
  const picker=exIds.length>4
    ? field('תרגיל',`<select data-a="pexSel">${exIds.map(x=>`<option value="${x}" ${x===sel?'selected':''}>${ex(x).name}</option>`).join('')}</select>`)
    : `<div class="row" style="flex-wrap:wrap;gap:6px">${exIds.map(x=>`<button class="pill ${x===sel?'on':''}" data-a="pex" data-v="${x}" aria-pressed="${x===sel}">${ex(x).name}</button>`).join('')}</div>`;
  return shell(nm(tname(tid)),'גרף התקדמות',`
  ${picker}
  <div class="grid2">${tile('שיא אישי',`${best}${e.body?'':' ק"ג'}`,fmtY(pts[bi].date))}${tile('אימונים',pts.length,`מאז ${fmt(pts[0].date)}`)}</div>
  <div class="card">${chart}<div class="muted small">${e.body?'מספר החזרות הגבוה בכל אימון (תרגיל משקל גוף)':'המשקל הגבוה בכל אימון, בק"ג'}. הנקודה המודגשת היא השיא האישי.</div></div>`);
};

const MUTATING=new Set(['sendInvite','newProgram','saveTarget','doSwap','saveProgram','addExercise','attachLink','uploadOk','saveGoal','saveNote','createPayReq','payDemo','prizeDelivered','createChallenge','addReward','delivered','publishClass','saveAttendance','cancelClass','lateDecide','saveSettings','saveWorkout','saveFix','register','cancelReg','sendLate','offerYes','offerNo','redeem','markRead','acceptInvite','sendCoachInvite']);
const actions={
  back, retry:()=>load(), tab:(v)=>setTab(v), go:(v,p)=>go(v,{id:p}), noop:()=>{},
  theme:()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;store.set('fitness-theme',t);render()},
  role:(v)=>{S.role=v;S.roles=v==='trainee'?['trainee']:['owner','coach'];setTab({coach:'coachHome',trainee:'traineeHome',owner:'ownerHome'}[v])}, // המאמן בנתוני הדוגמה הוא גם בעל העסק
  sendCoachInvite:()=>{const n=kName.value.trim(),m=kMail.value.trim();
    if(!n||!/^\S+@\S+\.\S+$/.test(m))return toast('פרט הקשר לא תקין. כדאי לבדוק ולנסות שוב');
    coaches.push({id:'k'+uid(),name:n+' (דוגמה)',joined:false,trainees:[],invite:{link:'https://example.com/fitness-app/?coach='+uid(),until:addDays(TODAY,ref.inviteValidDays)}});back();toast('ההזמנה נשלחה במייל')},
  signInDemo:()=>toast('באב הטיפוס הכניסה היא בבחירת תפקיד, למטה'),
  sendReset:()=>{if(!/^\S+@\S+\.\S+$/.test(fpMail.value))return toast('פרט הקשר לא תקין. כדאי לבדוק ולנסות שוב');back();toast('אם המייל רשום, נשלח אליו קישור')},
  savePassword:()=>{back();toast('הסיסמה נשמרה')},
  logout:()=>{S.role=null;S.roles=[];S.tab=null;S.stack=[];render()},
  acceptInvite:()=>{const t=trainees.find(x=>x.id==='t4');t.joined=true;S.role='trainee';S.me='t4';setTab('traineeHome');toast('הצטרפת! המאמן יבנה לך תוכנית')},
  sendInvite:(v)=>{const n=invName.value.trim(),m=invMail.value.trim();
    if(!n||(v==='mail'&&!/^\S+@\S+\.\S+$/.test(m)))return toast('פרט הקשר לא תקין. כדאי לבדוק ולנסות שוב');
    const t={id:'t'+uid(),name:n+' (דוגמה)',joined:false,invite:{link:'https://example.com/fitness-app/?join='+uid(),until:addDays(TODAY,ref.inviteValidDays)}};trainees.push(t);
    S.stack.pop();if(v==='mail'){render();toast('ההזמנה נשלחה במייל')}else go('inviteDone',{id:t.id})},
  shareInvite:(p)=>{const t=trainees.find(x=>x.id===p);if(navigator.share)navigator.share({title:'הזמנה לאפליקציית האימונים',url:t.invite.link}).catch(()=>{});else actions.copyInvite(p)},
  copyInvite:(p)=>{const t=trainees.find(x=>x.id===p);
    (navigator.clipboard?navigator.clipboard.writeText(t.invite.link):Promise.reject()).then(()=>toast('הקישור הועתק'),()=>toast('ההעתקה לא הצליחה. אפשר לסמן את הקישור ולהעתיק ידנית'))}, // "הועתק" רק כשהצליח (ממצא 5)
  askNew:(p)=>{S.params.confirmNew=p;render()},
  cancelNew:()=>{S.params.confirmNew=null;render()},
  newProgram:(p)=>{S.params.confirmNew=null;if(programs[p]){(inactivePrograms[p]=inactivePrograms[p]||[]).push({name:'תוכנית קודמת',from:addDays(TODAY,-30)})}
    programs[p]={active:true,workouts:[{id:'w'+uid(),name:'אימון A',items:[]}]};render();toast('נפתחה תוכנית חדשה. הקודמת נשמרה כלא פעילה')},
  addWorkout:(p)=>{const w=programs[p].workouts;w.push({id:'w'+uid(),name:'אימון '+'ABCDEFG'[w.length],items:[]});render()},
  addItem:(p)=>{const [tid,wi]=p.split('|');programs[tid].workouts[wi].items.push({ex:'e7',sets:3,reps:10,weight:20});
    go('itemTarget',{id:`${tid}|${wi}|${programs[tid].workouts[wi].items.length-1}`})},
  saveTarget:(p)=>{const [tid,wi,ii]=p.split('|');const it=programs[tid].workouts[wi].items[ii];
    const s=+tS.value,r=+tR.value,w=+tW.value; if(!(s>0&&r>0&&w>=0))return toast('חסר מידע בתרגיל. צריך סטים, חזרות ומשקל');
    Object.assign(it,{sets:s,reps:r,weight:w});back();toast('היעד נשמר')},
  doSwap:(p)=>{const [tid,wi,ii,e]=p.split('|');programs[tid].workouts[wi].items[ii].ex=e;S.stack.pop();go('itemTarget',{id:`${tid}|${wi}|${ii}`});toast('התרגיל הוחלף באותו מקום')},
  saveProgram:(p)=>{const bad=programs[p].workouts.some(w=>!w.items.length);if(bad)return toast('יש אימון בלי תרגילים. צריך להוסיף תרגיל או למחוק את האימון');toast('התוכנית נשמרה, והמתאמן כבר רואה אותה')},
  addExercise:()=>{const n=exName.value.trim();if(!n)return toast('חסר שם לתרגיל');exercises.push({id:'e'+uid(),name:n,body:exBody.checked,video:null});back();toast('התרגיל נוסף לרשימה')},
  attachLink:(p)=>{const v=vidLink.value.trim();if(!/^https?:\/\//.test(v))return toast('זה לא נראה כמו סרטון. כדאי לנסות קישור אחר');ex(p).video='youtube';render();toast('הסרטון צורף, ומופיע בכל התוכניות')},
  uploadOk:(p)=>{ex(p).video='upload';render();toast('הסרטון עלה (דוגמה)')},
  uploadLong:()=>toast(`אפשר להעלות סרטון ${videoLimit()}`),
  saveGoal:(p)=>{const v=+gVal.value;if(!(v>0))return toast('חסר משקל יעד');goals[p]={ex:gEx.value,value:v,status:'פעיל'};back();toast('היעד נשמר')},
  saveNote:(p)=>{const t=noteTxt.value.trim();if(!t||t.length>ref.noteMax)return toast('ההערה ריקה או ארוכה מדי. אפשר לקצר ולנסות שוב');
    const [tid,k]=p.split(/\|(.+)/);notes[k]=t;(inbox[tid]=inbox[tid]||[]).unshift({id:'n'+uid(),text:'המאמן הוסיף הערה לאימון שלך',date:TODAY});back();toast('ההערה נשמרה, והמתאמן יראה אותה')},
  createPayReq:()=>{payments.push({id:'p'+uid(),tid:prT.value,type:prType.value,amount:ref.prices[prType.value],status:'פתוחה',date:TODAY,invoice:null});back();toast('בקשת התשלום נשלחה למתאמן')},
  payDemo:(p)=>{const x=payments.find(y=>y.id===p);if(x.status==='שולמה')return toast('הבקשה הזו כבר שולמה');x.status='שולמה';x.invoice=invoiceSeq++;render();toast('התשלום לדוגמה הושלם, וחשבונית נוצרה')},
  prizeDelivered:(p)=>{challenge.completions.find(c=>c.tid===p).delivered=true;render();toast('סומן: הפרס נמסר')},
  chType:(v)=>{document.querySelectorAll('#chType button').forEach(b=>{b.classList.toggle('on',b.dataset.v===v);b.setAttribute('aria-pressed',b.dataset.v===v)});S.params.chType=v},
  createChallenge:()=>toast('כבר יש אתגר השבוע. אפשר ליצור את הבא בשבוע הבא'),
  saveChallenge:()=>{const n=chEName.value.trim();if(!n)return toast('חסר שם לאתגר');
    if(!challenge.completions.length){const t=+chETarget.value;if(!(t>0))return toast('חסר יעד לאתגר, או שמתאמן כבר השלים אותו. אחרי השלמה אפשר לשנות רק שם ופרס');challenge.target=t}
    challenge.name=n;challenge.prize=chEPrize.value.trim()||null;back();toast('האתגר עודכן')},
  addReward:()=>{const n=rwName.value.trim(),pr=+rwPrice.value;if(!n||!(pr>0))return toast('חסר שם או מחיר');rewards.push({id:'rw'+uid(),name:n,price:pr});render();toast('התגמול נוסף לקטלוג')},
  delivered:(p)=>{redemptions.find(r=>r.id===p).status='סופק';render();toast('סומן: התגמול סופק')},
  publishClass:()=>{const cap=+clCap.value;if(!(cap>0)||!clPlace.value.trim())return toast('חסרים פרטים בשיעור. צריך להשלים ולנסות שוב');
    classes.push({id:'c'+uid(),date:new Date(clDate.value+'T00:00'),time:clTime.value,place:clPlace.value,cap,reg:[],wait:[],attended:null,cancelled:false,coach:'k1'});back();toast('השיעור פורסם')},
  toggleAtt:(p)=>{const [cid,t]=p.split('|');const c=classes.find(x=>x.id===cid);c.attended=c.attended||[];c.attended=c.attended.includes(t)?c.attended.filter(x=>x!==t):[...c.attended,t];render()},
  saveAttendance:(p)=>{const c=classes.find(x=>x.id===p);let n=0;(c.attended||[]).forEach(t=>{if(award(t,'attendance','att-'+p+t))n++});toast(n?`הנוכחות נשמרה. ${n} מתאמנים קיבלו מטבעות`:'הנוכחות נשמרה')},
  cancelClass:(p)=>{const c=classes.find(x=>x.id===p);c.cancelled=true;[...c.reg,...c.wait].forEach(t=>(inbox[t]=inbox[t]||[]).unshift({id:'n'+uid(),text:`השיעור ב${fmtDay(c.date)} בוטל בידי המאמן`,date:TODAY}));render();toast('השיעור בוטל, והנרשמים קיבלו הודעה')},
  lateDecide:(p)=>{const [id,d]=p.split('|');const r=lateRequests.find(x=>x.id===id);r.status=d==='ok'?'אושרה':'נדחתה';
    const c=classes.find(x=>x.id===r.cid);if(d==='ok'){c.reg=c.reg.filter(t=>t!==r.tid);offerNext(c)}
    (inbox[r.tid]=inbox[r.tid]||[]).unshift({id:'n'+uid(),text:`בקשת הביטול שלך ${r.status}`,date:TODAY});render();toast(`הבקשה ${r.status}`)},
  saveSettings:()=>{const bad=[...document.querySelectorAll('input[data-ref]')].find(i=>i.value===''||isNaN(+i.value)||+i.value<0);
    if(bad)return toast(`הערך ב"${document.querySelector(`label[for="${bad.id}"]`).textContent}" אינו מספר תקין`); // ממצא 14: אומרים איזה שדה
    document.querySelectorAll('[data-ref]').forEach(i=>{const k=i.dataset.ref.split('.');let o=ref;while(k.length>1)o=o[k.shift()];o[k[0]]=i.type==='number'?+i.value:i.value});toast('ההגדרות נשמרו')},
  // מתאמן
  startWorkout:(p)=>{draft=null;go('workout',{id:p})},
  toggleSet:(p)=>{const [ii,si]=p.split('|');const s=draft.items[ii].sets[si];s.done=!s.done;render()},
  saveWorkout:()=>{
    for(const it of draft.items)for(const s of it.sets)if(!(s.reps>=0&&s.weight>=0)||isNaN(s.reps))return toast('יש ערך לא תקין באחד הסטים. כדאי לבדוק ולנסות שוב');
    const me=S.me,d=new Date(TODAY),prs=[];let done=0,total=0;
    draft.items.forEach(it=>{const e=ex(it.ex);const prev=chartPoints(me,it.ex).map(x=>x.v);const v=e.body?Math.max(...it.sets.filter(s=>s.done).map(s=>+s.reps),0):Math.max(...it.sets.filter(s=>s.done).map(s=>+s.weight),0);
      if(prev.length&&v>Math.max(...prev))prs.push(e.name);
      it.sets.forEach(s=>{total++;if(s.done)done++});
      results.push({tid:me,date:d,wid:draft.wid,ex:it.ex,sets:it.sets.map(s=>({...s})),corrected:false})});
    const refId='w-'+uid();const coins=award(me,'workout',refId);
    let goal=false;const g=goals[me];if(g&&g.status==='פעיל'){const it=draft.items.find(i=>i.ex===g.ex);if(it&&Math.max(...it.sets.map(s=>+s.weight))>=g.value){g.status='הושג, ממתין ליעד חדש';award(me,'goal','g-'+refId);goal=true}}
    let chal=false;const cp=challengeProgress(me);if(!cp.exempt&&cp.value>=cp.target&&!challenge.completions.some(c=>c.tid===me)){challenge.completions.push({tid:me,delivered:false});award(me,'challenge','ch-'+challenge.id+me);chal=true}
    draft=null;S.stack=[{screen:'feedback',params:{id:{done,total,prs,coins,goal,chal}}}];window.scrollTo(0,0);render()},
  saveFix:(p)=>{const rows=results.filter(r=>r.tid===S.me&&(r.date.toDateString()+r.wid)===p);
    document.querySelectorAll('[data-fix]').forEach(i=>{const [ri,si,f]=i.dataset.fix.split('|');const s=rows[ri].sets[si];if(+i.value!==+s[f]){s[f]=+i.value;rows[ri].corrected=true}});
    back();toast('התיקון נשמר. המטבעות לא השתנו, והמאמן יראה שהערך תוקן')},
  pex:(v)=>{S.params.pex=v;render()},
  register:(p)=>{const c=classes.find(x=>x.id===p),me=S.me;if(c.reg.includes(me)||c.wait.includes(me))return toast('כבר יש הרשמה לשיעור הזה');
    if(c.reg.length<c.cap){c.reg.push(me);toast('נרשמת לשיעור')}else{c.wait.push(me);toast(`השיעור מלא. נכנסת לרשימת ההמתנה, מקום ${c.wait.length}`)}render()},
  cancelReg:(p)=>{const c=classes.find(x=>x.id===p),me=S.me;const [hh,mm]=c.time.split(':');const start=new Date(c.date);start.setHours(+hh,+mm);const hrs=(start-TODAY)/36e5;
    if(hrs<ref.cancelHours){go('lateCancel',{id:p});return}
    c.reg=c.reg.filter(t=>t!==me);offerNext(c);render();toast('ההרשמה בוטלה')},
  sendLate:(p)=>{if(!lateRequests.some(r=>r.tid===S.me&&r.cid===p&&r.status==='ממתינה'))lateRequests.push({id:'l'+uid(),tid:S.me,cid:p,status:'ממתינה'});back();toast('הבקשה נשלחה למאמן')},
  cancelRedeem:()=>{S.params.confirmRedeem=null;render()},
  offerYes:(p)=>{const c=classes.find(x=>x.id===p);c.wait=c.wait.filter(t=>t!==S.me);c.reg.push(S.me);c.offer=null;render();toast('נרשמת לשיעור')},
  offerNo:(p)=>{const c=classes.find(x=>x.id===p);c.wait=c.wait.filter(t=>t!==S.me);c.offer=null;offerNext(c);render();toast('המקום הוצע לבא בתור')},
  markRead:(p)=>{inbox[S.me]=(inbox[S.me]||[]).filter(m=>m.id!==p);render()},
  redeem:(p)=>{const r=rewards.find(x=>x.id===p),me=S.me;if(balance(me)<r.price)return toast(`אין מספיק מטבעות. חסרים לך עוד ${num(r.price-balance(me))}`);
    if(S.params.confirmRedeem!==p){S.params.confirmRedeem=p;render();return}
    S.params.confirmRedeem=null;
    coinLedger.push({tid:me,type:'redeem',amt:-r.price,date:TODAY,ref:'rd-'+uid()});redemptions.push({id:'rd'+uid(),tid:me,reward:p,status:'ממתין לאספקה',date:TODAY});render();toast('מימשת! המאמן יספק את התגמול')},
};
function offerNext(c){ if(c.wait.length&&c.reg.length<c.cap){c.offer={tid:c.wait[0],until:ref.spotOfferHours};(inbox[c.wait[0]]=inbox[c.wait[0]]||[]).unshift({id:'n'+uid(),text:`התפנה מקום בשיעור ב${fmtDay(c.date)}`,date:TODAY})} }

/* ---- חיבור אירועים ---- */
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;const name=b.dataset.a;const f=actions[name];if(!f)return;
  const run=()=>{
    if(S.offline&&MUTATING.has(name)&&!(name==='redeem'&&S.params.confirmRedeem!==b.dataset.p))return toast('אין חיבור כרגע, ולכן הפעולה לא נשמרה. אפשר לנסות שוב');
    f(b.dataset.v??b.dataset.p,b.dataset.p)};
  if(b.dataset.busy){const t=b.textContent;b.disabled=true;b.textContent=b.dataset.busy;setTimeout(()=>{b.disabled=false;b.textContent=t;run()},700)} // כפתור "שולח" (ממצא 16)
  else run()});
app.addEventListener('change',e=>{if(e.target.dataset.a==='pexSel'){S.params.pex=e.target.value;render()}});
app.addEventListener('input',e=>{const i=e.target;if(i.dataset.set){const [ii,si,f]=i.dataset.set.split('|');draft.items[ii].sets[si][f]=i.value===''?NaN:+i.value}});
document.getElementById('pSid').addEventListener('change',e=>{S.sid=e.target.checked;render()});
document.getElementById('pOff').addEventListener('change',e=>{S.offline=e.target.checked;render()});
document.getElementById('pOut').addEventListener('click',()=>actions.logout());
function render(){fid=0;const c=cur();app.innerHTML=(screens[c.screen]||screens.signIn)(c.params||{})}
render();
</script>
</body>
</html>
