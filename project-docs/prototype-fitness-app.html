<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אב טיפוס אפליקציית מאמן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Heebo:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== מודול העיצוב (D01), גרסה 2: אסימוני FORM (reference/form/README.md), עם תיקוני סקירת העיצוב =====
   ממצא 7: עברית בגופן המונו נופלת ל-Heebo. ממצא 17: accent ו-muted3 כהים יותר במצב בהיר (ניגודיות 4.5:1). */
:root{
  --page:#e8e8e3; --bg:#f4f4f1; --card:#ffffff; --ink:#161916; --muted:#555a53; --muted2:#5f635c; --muted3:#6b6f68;
  --line:#e8e8e3; --line-in:#e0e0da; --tint:#eef8d6; --tint2:#e2f5c4; --tintInk:#1d3a12; --warn:#fdf0e2; --warnInk:#8a4a0f;
  --chip:#f0f0ec; --seg:#e6e6e0; --hero:#13261a; --heroSub:#b9c4bb; --heroNum:#c3f03f; --sel:#13261a; --selFg:#fff;
  --accent:#237a3f; --lime:#c3f03f; --limeInk:#15260c; --orange:#d9822b; --danger:#b3261e; --demo:#fff4c2; --demoInk:#5b4a00;
  --img1:#cfe3c0; --img2:#9fc48c;
  --font:Geist,Heebo,system-ui,sans-serif; --mono:"Geist Mono",Heebo,ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0b0d0b; --bg:#121512; --card:#1b1f1b; --ink:#eef0ea; --muted:#a3a89f; --muted2:#a3a89f; --muted3:#9a9f96;
    --line:#2c312c; --line-in:#343a34; --tint:#1f3324; --tint2:#28432d; --tintInk:#d4f0a6; --warn:#3a2b1b; --warnInk:#f3c896;
    --chip:#262b26; --seg:#232823; --hero:#1f3527; --sel:#c3f03f; --selFg:#15260c; --accent:#7fd08f; --danger:#f2b8b5;
    --demo:#3a3410; --demoInk:#f3e39a; --img1:#23382a; --img2:#2f4d37;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0b0d0b; --bg:#121512; --card:#1b1f1b; --ink:#eef0ea; --muted:#a3a89f; --muted2:#a3a89f; --muted3:#9a9f96;
  --line:#2c312c; --line-in:#343a34; --tint:#1f3324; --tint2:#28432d; --tintInk:#d4f0a6; --warn:#3a2b1b; --warnInk:#f3c896;
  --chip:#262b26; --seg:#232823; --hero:#1f3527; --sel:#c3f03f; --selFg:#15260c; --accent:#7fd08f; --danger:#f2b8b5;
  --demo:#3a3410; --demoInk:#f3e39a; --img1:#23382a; --img2:#2f4d37;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font-family:inherit}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media (min-width:600px){.app{box-shadow:0 30px 80px rgba(20,30,20,.18);margin:16px auto;min-height:calc(100vh - 96px);border-radius:28px;overflow:hidden}}

/* פס ההדגמה בייצור (ממצא 1, הכרעה 2) */
.demo-bar{background:var(--demo);color:var(--demoInk);font-size:12px;padding:6px 16px;text-align:center}

/* הכותרת: חזרה עם חץ ימינה (ממצא 38), מצב כהה או בהיר שנשמר (27) */
header.hd{background:var(--card);padding:6px 20px 16px;position:relative}
.hd-top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);background:none;border:0;font-size:15px;min-height:44px;padding:0;cursor:pointer}
.theme{background:var(--chip);border:1px solid var(--line);border-radius:999px;min-height:32px;padding:0 12px;font-size:12px;cursor:pointer;color:var(--ink)}
.eyebrow{font-size:11px;letter-spacing:.05em;color:var(--accent);margin-top:2px;display:flex;justify-content:space-between;gap:8px}
.sid{font-family:var(--mono);color:var(--muted3);font-size:10px}
h1{font-size:27px;font-weight:500;letter-spacing:-.01em;line-height:1.15;margin:4px 0 0;text-wrap:balance}
h2{font-size:19px;font-weight:500;margin:6px 0 0}
main{flex:1;padding:16px 18px 28px;display:flex;flex-direction:column;gap:12px;animation:enter .28s ease}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main{animation:none}}

/* פריסה */
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sechd{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sechd h2{margin:0}
.muted{color:var(--muted)} .small{font-size:12px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.divider{border-top:1px solid var(--line);padding-top:8px}

/* כרטיסים */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.hero{background:var(--hero);color:#fff;border-radius:16px;padding:16px 18px}
.hero .sub{color:var(--heroSub);font-size:12px}
.hero .lead{font-size:18px;font-weight:500}
.hero .num{font-size:24px;font-weight:500;color:var(--heroNum);font-family:var(--mono)}
.hero .cap{font-size:10px;color:var(--heroSub);letter-spacing:.04em}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:right;color:var(--ink);font-size:14px;width:100%}
button.tile{cursor:pointer}
.tile .lbl{font-size:11px;letter-spacing:.04em;color:var(--muted2)}
.tile .num{font-size:24px;margin-top:6px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tile .cap{font-size:12px;color:var(--accent);margin-top:4px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;text-align:right;width:100%;color:inherit;font-size:14px;min-height:52px}
button.item{cursor:pointer}
button.item:hover{border-color:var(--line-in)}
.item .grow{flex:1;min-width:0}
.item .t{font-size:15px}
.item .s{font-size:12px;color:var(--muted);margin-top:2px}
.chev{flex:none;color:var(--muted3);display:inline-flex}
.when{width:52px;flex:none}
.when .h{font-size:14px;font-family:var(--mono)}
.when .d{font-size:11px;color:var(--muted);margin-top:2px}
.av{width:38px;height:38px;border-radius:50%;background:var(--tint);color:var(--tintInk);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex:none}
.tintrow{display:flex;align-items:center;gap:12px;background:var(--tint);border-radius:14px;padding:12px 14px;width:100%;border:0;text-align:right;color:var(--ink);font-size:13px;cursor:pointer}
.notice{background:var(--tint);border-radius:14px;padding:12px 14px}
.warnbox{background:var(--warn);border-radius:14px;padding:12px 14px}
.confirm{background:var(--warn);border-radius:18px;padding:14px 16px}

/* תמונות דקורטיביות: מקום שמור. התמונות עצמן נבחרות במשימה 4, באישור הצוות */
.img{height:170px;border-radius:16px;background:linear-gradient(135deg,var(--img1),var(--img2));display:flex;align-items:flex-end;padding:12px;color:var(--tintInk);font-size:11px}
.img.tall{height:230px}
.img.short{height:120px}

/* תגיות בלי שבירה ובלי מתיחה (ממצא 33) */
.badge{display:inline-block;flex:none;align-self:center;white-space:nowrap;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:500;background:var(--chip);color:var(--ink)}
.badge.ok{background:var(--tint2);color:var(--tintInk)}
.badge.warn{background:var(--warn);color:var(--warnInk)}
.badge.demo{background:var(--demo);color:var(--demoInk)}

/* כפתורים: מצב "שולח" (16), שטח לחיצה 44 (26), כפתור קטן בלי גובה קבוע (13) */
.btn{min-height:50px;width:100%;border-radius:999px;border:0;background:var(--lime);color:var(--limeInk);font-size:15px;font-weight:500;cursor:pointer;padding:0 18px}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.small{min-height:36px;width:auto;padding:6px 16px;font-size:13px}
.btn:disabled{opacity:.55;cursor:progress}
.btn:focus-visible,.item:focus-visible,.pill:focus-visible,.tile:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px;padding:0 4px;min-height:44px;display:inline-flex;align-items:center;gap:4px}

/* טפסים: תווית מקושרת לשדה (18), מייל וקישור משמאל לימין (8) */
input,select,textarea{width:100%;font-size:15px;padding:11px 12px;border-radius:12px;border:1px solid var(--line-in);background:var(--card);color:var(--ink)}
textarea{resize:vertical;line-height:1.45}
input[type=email],input[type=url],input.ltr{direction:ltr;text-align:left}
input[type=email]::placeholder,input[type=url]::placeholder{text-align:left}
label{font-size:12px;color:var(--muted2);display:block;margin-bottom:4px}
.checkline{display:flex;align-items:center;gap:10px;min-height:44px}
.checkline input{width:20px;height:20px}
.seg{display:flex;background:var(--seg);border-radius:999px;padding:3px;gap:4px}
.seg button{flex:1;height:34px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:500}
.pill{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:12px;color:var(--ink)}
.pill.on{background:var(--sel);color:var(--selFg);border-color:transparent}
.setrow{display:grid;grid-template-columns:36px 1fr 1fr 44px;gap:6px;align-items:center}
.setrow input{padding:9px;text-align:center}
.check{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-in);background:var(--card);cursor:pointer;color:var(--ink);font-size:16px}
.check.on,.check[aria-pressed=true]{background:var(--tint2);color:var(--tintInk);border-color:transparent}
.status{border:0;background:none;min-height:44px;padding:0 4px;font-size:13px;cursor:pointer;color:var(--muted3)}
.status[aria-pressed=true]{color:var(--accent);font-weight:500}
.exline{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
.setchip{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;background:var(--chip);border-radius:8px;padding:3px 8px;white-space:nowrap}
.linkbox{direction:ltr;text-align:left;font-family:var(--mono);font-size:12px;background:var(--chip);border-radius:12px;padding:10px 12px;word-break:break-all}

/* מצבים: טוען (6), שגיאה עם "לנסות שוב" (2), ריק (30) */
.skel{background:var(--card);border:1px solid var(--line);border-radius:14px;height:64px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--chip),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.skel::after{animation:none}}
.state{background:var(--card);border:1px dashed var(--line-in);border-radius:14px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.state .t{font-size:15px;font-weight:500}
.state .s{font-size:13px;color:var(--muted)}
.state.err .t{color:var(--danger)}

/* וידאו וגרף */
.video{background:#0d100d;color:#fff;border-radius:16px;height:170px;display:flex;align-items:center;justify-content:center;font-size:13px;text-align:center;padding:12px}
svg.chart text{fill:var(--muted2);font-size:10px;font-family:var(--mono)}

/* סרגל הלשוניות עם אייקונים (26); לשונית לא פעילה בניגודיות תקינה (17) */
nav.tabs{position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--card);border-top:1px solid var(--line)}
nav.tabs button{flex:1;padding:8px 4px 12px;border:0;background:none;color:var(--muted3);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px}
nav.tabs button.on{color:var(--accent);font-weight:500}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--hero);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;z-index:5}
.toast.show{opacity:1;transform:translate(-50%,-8px)}

/* כלי אב הטיפוס, מחוץ לאפליקציה */
.proto{max-width:430px;margin:0 auto 24px;padding:10px 16px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.proto label{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:12px;color:var(--muted)}
.proto input{width:auto}
.proto button{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12px;padding:6px 0}
.proto-box{border:1px dashed var(--line-in);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="proto" aria-label="כלי אב הטיפוס">
  <b>כלי אב הטיפוס:</b>
  <label><input type="checkbox" id="pSid" checked> מספרי המסכים</label>
  <label><input type="checkbox" id="pOff"> שרת לא זמין</label>
  <button id="pOut">חזרה לכניסה</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ============================================================
   אב טיפוס, גרסה 2 (30.09.2026, שלב העיצוב). נתונים סינתטיים בלבד.
   המקורות: גרסה 1; drafts/findings-design-review.md; תוכנית שלב העיצוב (הכרעות 1 עד 4).
   מה השתנה מגרסה 1:
   - שפה חזותית של FORM: כרטיס גיבור עם מספר בליים, אריחי מספרים, שורות עם עמודת שעה, עיגולי ראשי תיבות,
     סרגל לשוניות עם אייקונים, מקומות לתמונות דקורטיביות (בכניסה, בהצטרפות ובמצבים ריקים).
   - מסך הכניסה S23 ומסך ההצטרפות S22 כפי שנבנו בשלב 5. בחירת התפקיד קיימת רק באב הטיפוס.
   - נוסח ניטרלי בכל המסכים (הכרעה 3). חצים כמקובל בעברית (הכרעה 4). פס ההדגמה הקצר (הכרעה 2).
   - מצבי טעינה, שגיאה עם "לנסות שוב" וריק (ממצאים 2, 6, 30); פעולה שנכשלה אינה מדווחת הצלחה (3);
     כפתור "שולח" (16); קישור ההזמנה מוצג במסך עם שיתוף והעתקה (5).
   - ממצאי הנוסח והמבנה: 7 עד 14, 17 עד 21, 26 עד 35, 37, 38 (הפירוט בדוח השלב).
   עדכון בסקירת המסכים (הכרעת הצוות, 30.09.2026): כשיש אתגר השבוע, S09 מציג את יום הפרסום הבא במקום כפתור ההוספה.
   והכרעת הצוות על פערים 4 עד 6 בדוח השלב: "אני" בלי שם, יתרה ותגית; הזמנה שלא מומשה אינה לחיצה; תוכנית קודמת "מ-" תאריך היצירה.
   ============================================================ */
const TODAY = new Date(2026, 8, 28, 12, 0); // יום שני, 28.09.2026 [נתוני דוגמה]
const DAYS=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const fmt = d => `${d.getDate()}.${d.getMonth()+1}`;                          // 28.9
const fmtY = d => `${fmt(d)}.${d.getFullYear()}`;                              // 28.9.2026, בחשבונית (ממצא 32)
const fmtDay = d => `יום ${DAYS[d.getDay()]}, ${fmt(d)}`;                       // יום ב׳, 28.9 (ממצא 32)
const num = n => Number(n).toLocaleString('he-IL');                           // 125,000 (ממצא 32)
const signed = n => `<span class="ltr mono">${n>0?'+':''}${num(n)}</span>`;   // +10 (ממצא 8)
const nm = s => `<bdi>${s}</bdi>`;                                             // שם משתמש (ממצא 8)
const ini = s => s.replace(/\(.*?\)/g,'').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2);
const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const uid = ()=>Math.random().toString(36).slice(2,8);
const greeting = ()=>{const h=new Date().getHours();return h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<21?'ערב טוב':'לילה טוב'}; // ממצא 31
const videoLimit = ()=>ref.videoMaxSec===60?'עד דקה':`עד ${ref.videoMaxSec} שניות`; // ממצא 19

/* ---- אייקונים: קווים של 1.8, קצוות מעוגלים (FORM) ---- */
const svg=(p,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  home:svg('<path d="M3.5 9.5L10 4l6.5 5.5V16a1 1 0 0 1-1 1H12v-4.5H8V17H4.5a1 1 0 0 1-1-1z"/>'),
  users:svg('<circle cx="7.5" cy="7" r="2.8"/><path d="M2.5 16.5c.6-2.7 2.7-4.2 5-4.2s4.4 1.5 5 4.2"/><circle cx="14" cy="7.6" r="2.2"/><path d="M14 12.4c1.9.1 3.2 1.4 3.7 3.6"/>'),
  cal:svg('<rect x="3" y="4.5" width="14" height="12.5" rx="2.5"/><path d="M3 8.5h14M7 2.8v3.4M13 2.8v3.4"/>'),
  more:svg('<circle cx="5" cy="10" r=".6"/><circle cx="10" cy="10" r=".6"/><circle cx="15" cy="10" r=".6"/>'),
  dumbbell:svg('<path d="M6 6v8M14 6v8M3.5 8v4M16.5 8v4M6 10h8"/>'),
  user:svg('<circle cx="10" cy="7" r="3.2"/><path d="M3.5 17c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/>'),
  back:svg('<path d="M7.5 4l6 6-6 6"/>',16),     // חזרה: מצביע ימינה (ממצא 38)
  chev:svg('<path d="M12 5l-5 5 5 5"/>',14),     // חץ רשימה: מצביע שמאלה (ממצא 38)
  wifi:svg('<path d="M3 8.5a10 10 0 0 1 14 0M5.5 11.3a6.5 6.5 0 0 1 9 0M8.2 14a2.6 2.6 0 0 1 3.6 0M3 3l14 14"/>',28),
};

/* ---- טבלת הייחוס (SETTINGS): ערכים שהמאמן משנה בלי קוד ---- */
const ref = {
  coins:{workout:10, goal:30, challenge:50, attendance:5},
  prices:{monthly:350, pack10:600},
  cancelHours:24, streakGapDays:3, spotOfferHours:2, inviteValidDays:7,

function chartPoints(tid,exId){
  const e=ex(exId); const rows=results.filter(r=>r.tid===tid&&r.ex===exId).sort((a,b)=>a.date-b.date);
  return rows.map(r=>({date:r.date,v:e.body?Math.max(...r.sets.map(s=>+s.reps||0)):Math.max(...r.sets.map(s=>+s.weight||0)),corrected:r.corrected}));
}
function streak(tid){
  const days=[...new Set(results.filter(r=>r.tid===tid).map(r=>r.date.toDateString()))].map(s=>new Date(s)).sort((a,b)=>b-a);
  if(!days.length)return 0;
  if((new Date(TODAY.toDateString())-days[0])/864e5>ref.streakGapDays)return 0;
  let n=1; for(let i=1;i<days.length;i++){ if((days[i-1]-days[i])/864e5<=ref.streakGapDays)n++; else break;} return n;
}
function challengeProgress(tid){
  if(challenge.type==='exercise'){
    const p=programs[tid]; const inPlan=p&&p.workouts.some(w=>w.items.some(i=>i.ex===challenge.ex));

    const best=Math.max(0,...results.filter(r=>r.tid===tid&&r.ex===challenge.ex&&r.date>=challenge.start).flatMap(r=>r.sets.map(s=>+s.weight)));
    return {value:best,target:challenge.target};

  const n=new Set(results.filter(r=>r.tid===tid&&r.date>=challenge.start&&r.date<=addDays(challenge.end,1)).map(r=>r.date.toDateString()+r.wid)).size;
  return {value:n,target:challenge.target};
}

   ${tile('לתשלום',openN)}
  </div>
  <div class="list">
   <button class="item" data-a="go" data-v="programEdit" data-p="${id}"><div class="grow"><div class="t">תוכנית אימון</div><div class="s">${p?p.workouts.length+' אימונים':'טרם נבנתה'}</div></div>${chev}</button>
   <button class="item" data-a="go" data-v="progress" data-p="${id}"><div class="grow"><div class="t">התקדמות וגרף</div></div>${chev}</button>
   <button class="item" data-a="go" data-v="resultsCoach" data-p="${id}"><div class="grow"><div class="t">אימונים שבוצעו והערות</div></div>${chev}</button>
   <button class="item" data-a="go" data-v="paymentsCoach" data-p="${id}"><div class="grow"><div class="t">תשלומים וחשבוניות</div><div class="s">${pays.length} בקשות</div></div>${openN?'<span class="badge warn">לתשלום</span>':chev}</button>
   <button class="item" data-a="go" data-v="goalEdit" data-p="${id}"><div class="grow"><div class="t">יעד אישי</div><div class="s">${g?`${ex(g.ex).name} ${g.value} ק"ג · ${g.status}`:'אין יעד'}</div></div>${chev}</button>
  </div>`);
};

/* ----- S04 תוכנית אימון (מקרה שימוש 1) ----- */
screens.programEdit=({id})=>{
  const p=programs[id];
  if(!p) return shell(nm(tname(id)),'בניית תוכנית',`
    ${empty('למתאמן עוד אין תוכנית','התוכנית מתחילה באימון אחד, ואפשר להוסיף עוד.',img('לוח אימון','short'))}
    <button class="btn" data-a="newProgram" data-p="${id}">בניית תוכנית חדשה</button>`);
  const inactive=(inactivePrograms[id]||[]);
  return shell(nm(tname(id)),'תוכנית אימון',`
  ${p.workouts.map((w,wi)=>`<div class="card col"><div class="row between"><b>${w.name}</b><button class="link" data-a="addItem" data-p="${id}|${wi}">+ תרגיל</button></div>
    ${w.items.length?w.items.map((it,ii)=>`<div class="row between divider">
      <div><div>${ex(it.ex).name} ${ex(it.ex).video?'<span class="badge">סרטון</span>':''}</div>
      <div class="muted small mono">${it.sets} סטים · ${it.reps} חזרות · ${it.weight?it.weight+' ק"ג':'משקל גוף'}</div></div>
      <button class="btn sec small" data-a="go" data-v="swap" data-p="${id}|${wi}|${ii}">החלפה</button></div>`).join(''):'<div class="muted small divider">עוד אין תרגילים באימון הזה.</div>'}
  </div>`).join('')}
  <button class="btn sec" data-a="addWorkout" data-p="${id}">+ אימון נוסף</button>
  <button class="btn" data-a="saveProgram" data-p="${id}">שמירה</button>
  ${S.params.confirmNew===id?`<div class="confirm col" role="alertdialog" aria-label="אישור תוכנית חדשה"><b>התוכנית הנוכחית תישמר כלא פעילה. להמשיך?</b>
    <div class="row"><button class="btn small" data-a="newProgram" data-p="${id}">כן, תוכנית חדשה</button><button class="btn sec small" data-a="cancelNew">ביטול</button></div></div>`
   :`<button class="btn sec" data-a="askNew" data-p="${id}">בניית תוכנית חדשה במקום הזו</button>`}
  ${inactive.length?`<div class="muted small">תוכניות קודמות (לא פעילות): ${inactive.map(x=>x.name+' מ-'+fmtY(x.from)).join(', ')}</div>`:''}`);
};

screens.swap=({id})=>{
  const [tid,wi,ii]=id.split('|'); const it=programs[tid].workouts[wi].items[ii];
  return shell('החלפת תרגיל',ex(it.ex).name,`
  <div class="muted">התרגיל החדש ייכנס לאותו מקום בסדר. התוצאות של התרגיל הקודם נשארות בהיסטוריה.</div>
  <div class="list">${exercises.filter(e=>e.id!==it.ex).map(e=>`<button class="item" data-a="doSwap" data-p="${id}|${e.id}"><div class="grow"><div class="t">${e.name}</div><div class="s">${e.video?'יש סרטון':'אין סרטון'}</div></div>${chev}</button>`).join('')}</div>
  <button class="btn sec" data-a="go" data-v="exerciseNew">+ תרגיל חדש משלי</button>`);
};

screens.itemTarget=({id})=>{
  const [tid,wi,ii]=id.split('|'); const it=programs[tid].workouts[wi].items[ii];
  return shell('יעד לתרגיל',ex(it.ex).name,`
  <div class="grid3">${field('סטים',`<input id="tS" type="number" inputmode="numeric" value="${it.sets}">`)}
  ${field('חזרות',`<input id="tR" type="number" inputmode="numeric" value="${it.reps}">`)}
  ${field('משקל (ק"ג)',`<input id="tW" type="number" inputmode="decimal" value="${it.weight}">`)}</div>
  <div class="muted small">בתרגיל משקל גוף, משאירים משקל 0.</div>
  <button class="btn" data-a="saveTarget" data-p="${id}">שמירת היעד</button>`);
};

/* ----- S05 תרגילים וסרטונים (מקרה שימוש 10) ----- */
screens.exercises=()=>shell('רשימת התרגילים','תרגילים',`
  <div class="list">${exercises.map(e=>`<button class="item" data-a="go" data-v="exercise" data-p="${e.id}"><div class="grow"><div class="t">${e.name}</div><div class="s">${e.video==='youtube'?'קישור יוטיוב':e.video==='upload'?'סרטון שהועלה':'אין סרטון'}</div></div>${chev}</button>`).join('')}</div>
  <button class="btn" data-a="go" data-v="exerciseNew">+ תרגיל חדש</button>`);

screens.exerciseNew=()=>shell('תרגיל חדש','הוספת תרגיל',`
  ${field('שם התרגיל','<input id="exName" placeholder="לדוגמה: פרפר">')}
  <label class="checkline" for="exBody"><input type="checkbox" id="exBody"><span style="font-size:14px;color:var(--ink)">תרגיל משקל גוף</span></label>
  <button class="btn" data-a="addExercise">שמירה</button>`);

screens.exercise=({id})=>{const e=ex(id);return shell('תרגיל',e.name,`
  ${e.video?`<div class="video">▶︎ ${e.video==='youtube'?'סרטון הדגמה מיוטיוב (קישור לדוגמה)':'סרטון שהמאמן העלה (דוגמה)'}</div>`:empty('לתרגיל עוד אין סרטון','אפשר לצרף קישור או להעלות מהטלפון.')}
  <div class="muted small">הסרטון שייך לתרגיל, ומופיע בכל התוכניות שבהן התרגיל נמצא.</div>
  ${field('קישור לסרטון','<input id="vidLink" type="url" placeholder="https://www.youtube.com/...">')}
  <button class="btn sec" data-a="attachLink" data-p="${id}">צירוף קישור</button>
  <button class="btn sec" data-a="uploadOk" data-p="${id}" data-busy="מעלה...">העלאת סרטון מהטלפון (${videoLimit()})</button>
  <button class="link" data-a="uploadLong">מה קורה בסרטון ארוך יותר?</button>`)};

/* ----- S07 יעד אישי: נפתח על היעד הקיים (ממצא 4) ----- */
screens.goalEdit=({id})=>{const g=goals[id]||{ex:'e1',value:'',status:'חדש'};return shell(nm(tname(id)),'יעד אישי',`
  ${goals[id]?`<div class="notice small">היעד הנוכחי: ${ex(g.ex).name} ${g.value} ק"ג · ${g.status}. שמירה כאן מחליפה אותו.</div>`:''}
  ${field('תרגיל',`<select id="gEx">${exercises.filter(e=>!e.body).map(e=>`<option value="${e.id}" ${e.id===g.ex?'selected':''}>${e.name}</option>`).join('')}</select>`)}
  ${field('משקל יעד (ק"ג)',`<input id="gVal" type="number" inputmode="decimal" value="${g.value}">`)}
  <div class="muted small">כשהמתאמן עובר את היעד מתקבלים ${ref.coins.goal} מטבעות, והיעד נסגר עד שיוגדר יעד חדש.</div>
  <button class="btn" data-a="saveGoal" data-p="${id}">שמירת היעד</button>`)};

/* ----- S06 תוצאות והערות מאמן (מקרי שימוש 3, 6) ----- */
function groupWorkouts(tid){const byW={};results.filter(r=>r.tid===tid).forEach(r=>{const k=r.date.toDateString()+r.wid;(byW[k]=byW[k]||{date:r.date,wid:r.wid,rows:[]}).rows.push(r)});return Object.entries(byW).sort((a,b)=>b[1].date-a[1].date)}
const wName=wid=>{for(const p of Object.values(programs))if(p)for(const w of p.workouts)if(w.id===wid)return w.name;return 'אימון'};
screens.resultsCoach=({id})=>{
  const list=groupWorkouts(id);
  return shell(nm(tname(id)),'אימונים שבוצעו',`
  ${list.length?list.map(([k,w])=>`<div class="card col"><div class="row between"><b>${fmtDay(w.date)} · ${wName(w.wid)}</b>${w.rows.some(r=>r.corrected)?'<span class="badge warn">תוקן</span>':''}</div>
   ${w.rows.map(r=>exLine(r)).join('')}
   ${notes[k]?`<div class="notice small">ההערה שלך: ${notes[k]}</div>`:`<button class="link" data-a="go" data-v="noteAdd" data-p="${id}|${k}">+ הערה אישית</button>`}
  </div>`).join(''):empty('עוד אין אימונים שבוצעו','האימונים יופיעו כאן אחרי שהמתאמן ישמור אותם.')}`);
};
screens.noteAdd=({id})=>shell('הערה אישית','הערה לאימון',`
  ${field(`ההערה (עד ${ref.noteMax} תווים)`,`<textarea id="noteTxt" rows="4" maxlength="${ref.noteMax}" placeholder="לדוגמה: שיא יפה בסקוואט, בשבוע הבא ננסה 67.5"></textarea>`)}
  <button class="btn" data-a="saveNote" data-p="${id}">שמירה</button>`);

/* ----- S08 תשלומים (מקרה שימוש 2) ----- */
screens.paymentsCoach=({id})=>{
  const list=payments.filter(p=>!id||p.tid===id).sort((a,b)=>b.date-a.date);
  return shell('הדגמה, לא מתבצע חיוב',id?`תשלומים · ${nm(tname(id))}`:'תשלומים וחשבוניות',`
  <div class="list">${list.length?list.map(p=>`<div class="item"><div class="grow"><div class="t">${nm(tname(p.tid))} · ${payLabel[p.type]}</div><div class="s"><span class="mono">₪${num(p.amount)}</span> · ${fmtY(p.date)}</div></div>
   ${p.status==='שולמה'?`<button class="btn sec small" data-a="go" data-v="invoice" data-p="${p.id}">חשבונית ${p.invoice}</button>`:'<span class="badge warn">פתוחה</span>'}</div>`).join(''):empty('עוד אין בקשות תשלום')}</div>
  <button class="btn" data-a="go" data-v="payRequest" data-p="${id||''}">בקשת תשלום חדשה</button>`);
};
screens.payRequest=({id})=>shell('הדגמה, לא מתבצע חיוב','בקשת תשלום',`
  ${field('מתאמן',`<select id="prT">${trainees.filter(t=>t.joined).map(t=>`<option value="${t.id}" ${t.id===id?'selected':''}>${t.name}</option>`).join('')}</select>`)}
  ${field('סוג התשלום',`<select id="prType"><option value="monthly">מנוי חודשי · ₪${num(ref.prices.monthly)}</option><option value="pack10">חבילת 10 אימונים (כרטיסייה) · ₪${num(ref.prices.pack10)}</option></select>`)}
  <div class="muted small">המחירים מגיעים מההגדרות. הכרטיסייה בגרסה הראשונה היא סוג תשלום בלבד, ואינה סופרת אימונים.</div>
  <button class="btn" data-a="createPayReq">שליחת בקשת תשלום</button>`);
screens.invoice=({id})=>{const p=payments.find(x=>x.id===id);return shell('הדגמה, אינה חשבונית מס','חשבונית '+p.invoice,`
  <div class="card col"><span class="badge demo" style="align-self:flex-start">הדגמה, אינה חשבונית מס</span>
   <div class="row between"><span class="muted">מספר</span><span class="mono">${p.invoice}</span></div>
   <div class="row between"><span class="muted">לקוח</span><span>${nm(tname(p.tid))}</span></div>
   <div class="row between"><span class="muted">עבור</span><span>${payLabel[p.type]}</span></div>
   <div class="row between"><span class="muted">סכום</span><span class="mono">₪${num(p.amount)}</span></div>
   <div class="row between"><span class="muted">תאריך</span><span class="mono">${fmtY(p.date)}</span></div></div>`)};

/* ----- S09 אתגר שבועי (מקרה שימוש 8) ----- */
screens.challengeCoach=()=>shell(`שבוע ${fmt(challenge.start)} עד ${fmt(challenge.end)}`,'אתגר שבועי',`
  <div class="hero"><div class="sub">האתגר של השבוע</div><div class="lead" style="margin-top:4px">${challenge.name}</div><div class="sub" style="margin-top:4px">פרס: ${ref.coins.challenge} מטבעות + ${challenge.prize}</div></div>
  <h2>השלימו</h2>
  <div class="list">${challenge.completions.map(c=>`<div class="item"><span class="av">${ini(tname(c.tid))}</span><div class="grow t">${nm(tname(c.tid))}</div>${c.delivered?'<span class="badge ok">הפרס נמסר</span>':`<button class="btn sec small" data-a="prizeDelivered" data-p="${c.tid}">סימון מסירת פרס</button>`}</div>`).join('')||empty('עוד אף אחד לא השלים')}</div>
  <div class="muted small">האתגר הבא אפשר לפרסם מיום ראשון, ${fmt(addDays(challenge.end,1))}.</div>`); // אתגר אחד בשבוע: בלי "הוספה" כשיש אתגר (הכרעת הצוות, 30.09.2026)
screens.challengeNew=()=>shell('אתגר אחד בשבוע','הוספת אתגר',`
  ${field('שם','<input id="chName" value="חמישה אימונים השבוע">')}
  <div class="seg" id="chType" role="group" aria-label="סוג האתגר"><button class="on" data-a="chType" data-v="count" aria-pressed="true">מספר אימונים</button><button data-a="chType" data-v="exercise" aria-pressed="false">יעד בתרגיל</button></div>
  ${field('ערך היעד','<input id="chTarget" type="number" inputmode="numeric" value="5">')}
  ${field('פרס נוסף (לא חובה)','<input id="chPrize" placeholder="לדוגמה: חולצה">')}
  <div class="muted small">כל המתאמנים משתתפים. באתגר על תרגיל, מי שהתרגיל אינו בתוכנית שלו פטור. השבוע מתחיל ביום ראשון.</div>
  <button class="btn" data-a="createChallenge">פרסום האתגר</button>`);

/* ----- S10 תגמולים (מקרה שימוש 7) ----- */
screens.rewardsCoach=()=>shell('מטבעות ותגמולים','תגמולים',`
  <h2>קטלוג</h2>
  <div class="list">${rewards.map(r=>`<div class="item"><span class="t">${r.name}</span><span class="mono">${num(r.price)} מטבעות</span></div>`).join('')}</div>
  <div class="grid2">${field('שם התגמול','<input id="rwName" placeholder="לדוגמה: חולצה">')}${field('מחיר במטבעות','<input id="rwPrice" type="number" inputmode="numeric">')}</div>
  <button class="btn sec" data-a="addReward">+ הוספת תגמול</button>
  <h2>מימושים לאספקה</h2>
  <div class="list">${redemptions.map(r=>`<div class="item"><span class="av">${ini(tname(r.tid))}</span><div class="grow"><div class="t">${nm(tname(r.tid))}</div><div class="s">${(rewards.find(x=>x.id===r.reward)||{name:'תגמול שהוצא משימוש'}).name}</div></div>
   ${r.status==='סופק'?'<span class="badge ok">סופק</span>':`<button class="btn sec small" data-a="delivered" data-p="${r.id}">סימון סופק</button>`}</div>`).join('')||empty('אין מימושים לאספקה')}</div>`);

/* ----- S11 שיעורים (מקרה שימוש 11) ----- */
screens.classesCoach=()=>{
  const up=classes.filter(c=>c.date>=addDays(TODAY,-3)).sort((a,b)=>a.date-b.date);
  const pend=lateRequests.filter(r=>r.status==='ממתינה');
  return shell('שיעורים קבוצתיים','שיעורים',`
  ${pend.length?`<h2>בקשות ביטול חריגות</h2>${pend.map(r=>{const c=classes.find(x=>x.id===r.cid);return `<div class="warnbox col"><div>${nm(tname(r.tid))} מבקש/ת לבטל את השיעור ב${fmtDay(c.date)} בשעה ${c.time}</div>
   <div class="row"><button class="btn small" data-a="lateDecide" data-p="${r.id}|ok">אישור</button><button class="btn sec small" data-a="lateDecide" data-p="${r.id}|no">דחייה</button></div></div>`}).join('')}`:''}
  <div class="list">${up.length?up.map(c=>classRow(c,c.date<new Date(TODAY.toDateString())?'<span class="badge">עבר</span>':c.cancelled?'<span class="badge warn">בוטל</span>':chev,'go',c.id)).join(''):empty('אין שיעורים קרובים','שיעור שמתפרסם מופיע כאן ואצל המתאמנים.')}</div>
  <button class="btn" data-a="go" data-v="classNew">פרסום שיעור</button>`,{backBtn:S.stack.length>1});
};
screens.classNew=()=>shell('שיעור קבוצתי','פרסום שיעור',`
  <div class="grid2">${field('תאריך','<input id="clDate" type="date" value="2026-10-02">')}${field('שעה','<input id="clTime" type="time" value="18:30">')}</div>
  ${field('מקום','<input id="clPlace" value="פארק הירקון">')}
  ${field('מספר מקומות','<input id="clCap" type="number" inputmode="numeric" value="8">')}
  <button class="btn" data-a="publishClass">פרסום</button>`);
screens.classCoach=({id})=>{const c=classes.find(x=>x.id===id);const past=c.date<new Date(TODAY.toDateString());const att=c.attended||[];return shell(`${fmtDay(c.date)} · ${c.time}`,c.place,`
  ${c.cancelled?'<div class="warnbox">השיעור בוטל, והנרשמים קיבלו הודעה.</div>':''}
  <div class="grid2">${tile(past?'הגיעו':'רשומים',`${past?att.length:c.reg.length}/${past?c.reg.length:c.cap}`)}${tile('בהמתנה',c.wait.length)}</div>
  ${past?'<div class="muted small">מקישים על הסטטוס של מי שהגיע/ה, ואז שומרים.</div>':''}
  <div class="list">${c.reg.length?c.reg.map(t=>{const on=att.includes(t);return `<div class="row"><span class="av">${ini(tname(t))}</span><div class="grow" style="flex:1;font-size:15px">${nm(tname(t))}</div>${past?`<button class="status" data-a="toggleAtt" data-p="${id}|${t}" aria-pressed="${on}" aria-label="${tname(t)}: ${on?'הגיע/ה':'לא סומן/ה'}">${on?'✓ הגיע/ה':'לא סומן/ה'}</button>`:''}</div>`}).join(''):empty('עוד אין נרשמים')}</div>
  ${c.wait.length?`<h2>רשימת המתנה</h2>${c.wait.map((t,i)=>`<div class="row"><span class="av">${i+1}</span><div style="font-size:15px">${nm(tname(t))}</div></div>`).join('')}`:''}
  ${past?`<button class="btn" data-a="saveAttendance" data-p="${id}">שמירת נוכחות (מי שסומן מקבל ${ref.coins.attendance} מטבעות)</button>`:(!c.cancelled?`<button class="btn sec" data-a="cancelClass" data-p="${id}">ביטול השיעור והודעה לנרשמים</button>`:'')}`)};

/* ----- עוד, ו-S12 הגדרות ----- */
screens.more=()=>shell('כלים','עוד',`
  <div class="list">
   <button class="item" data-a="go" data-v="exercises"><span class="t grow">רשימת התרגילים והסרטונים</span>${chev}</button>
   <button class="item" data-a="go" data-v="challengeCoach"><span class="t grow">אתגר שבועי</span>${chev}</button>

screens.traineeHome=()=>{
  const me=S.me; const p=programs[me];
  const nextW=p&&p.workouts[(results.filter(r=>r.tid===me).length/3|0)%p.workouts.length];

  ${nextW?`<button class="item" data-a="startWorkout" data-p="${nextW.id}"><div class="grow"><div class="t">${nextW.name}</div><div class="s">${nextW.items.map(i=>ex(i.ex).name).join(' · ')}</div></div>${chev}</button>`
    :empty('התוכנית שלך בהכנה אצל המאמן','היא תופיע כאן כשתהיה מוכנה.')}
  <div class="sechd"><h2>השיעור הבא</h2><button class="link" data-a="tab" data-v="classesTrainee">לכל השיעורים</button></div>
  ${nextC?`<div class="item"><div class="when"><div class="h">${nextC.time}</div><div class="d">${DAYS[nextC.date.getDay()]} ${fmt(nextC.date)}</div></div><div class="grow"><div class="t">${nextC.place}</div></div><span class="badge ok">רשום</span></div>`
    :empty('לא נרשמת לשיעור')}
  <button class="tintrow" data-a="go" data-v="challengeTrainee"><span style="flex:1"><b>האתגר השבועי:</b> ${challenge.name}</span><span class="${cp.exempt?'muted':'badge ok'}">${cpText(cp)}</span></button>`,{backBtn:false});
};

/* ----- S14 אימון והזנת תוצאות (מקרה שימוש 3) ----- */
screens.workoutPick=()=>{const p=programs[S.me];return shell('התוכנית שלי','אימון',p?`

  :empty('התוכנית שלך עוד בהכנה אצל המאמן','היא תופיע כאן כשתהיה מוכנה.',img('משקולות','short')),{backBtn:false})};

let draft=null;
screens.workout=({id})=>{
  const w=programs[S.me].workouts.find(x=>x.id===id);
  if(!draft||draft.wid!==id) draft={wid:id,items:w.items.map(it=>({ex:it.ex,sets:Array.from({length:it.sets},()=>({reps:it.reps,weight:it.weight,done:true}))}))};
  return shell('ממולא לפי היעד · משנים רק מה ששונה',w.name,`
  ${draft.items.map((it,ii)=>{const e=ex(it.ex);const tgt=w.items[ii];return `<div class="card col">
    <div class="row between"><b>${e.name}</b>${e.video?`<button class="link" data-a="go" data-v="exerciseView" data-p="${e.id}">▶︎ סרטון הדגמה</button>`:''}</div>
    <div class="muted small">יעד: <span class="mono">${tgt.sets} סטים × ${tgt.reps}${tgt.weight?' · '+tgt.weight+' ק"ג':''}</span></div>
    <div class="setrow muted small" aria-hidden="true"><span>סט</span><span>חזרות</span><span>${e.body?'':'משקל'}</span><span>בוצע</span></div>
    ${it.sets.map((s,si)=>`<div class="setrow"><span class="mono">${si+1}</span>
      <input type="number" inputmode="numeric" aria-label="${e.name}, סט ${si+1}, חזרות" value="${s.reps}" data-set="${ii}|${si}|reps">
      ${e.body?'<span></span>':`<input type="number" inputmode="decimal" step="2.5" aria-label="${e.name}, סט ${si+1}, משקל" value="${s.weight}" data-set="${ii}|${si}|weight">`}
      <button class="check" data-a="toggleSet" data-p="${ii}|${si}" aria-pressed="${s.done}" aria-label="${e.name}, סט ${si+1} בוצע">${s.done?'✓':''}</button></div>`).join('')}
  </div>`}).join('')}
  <button class="btn" data-a="saveWorkout" data-busy="שומר...">שמירת האימון</button>`);
};
screens.exerciseView=({id})=>{const e=ex(id);return shell('סרטון הדגמה',e.name,`<div class="video">▶︎ ${e.video==='youtube'?'סרטון הדגמה מיוטיוב (קישור לדוגמה)':'סרטון שהמאמן העלה (דוגמה)'}</div>`)};

/* ----- S15 משוב (מקרה שימוש 6) ----- */
screens.feedback=({id})=>{const f=id;return shell('משוב','כל הכבוד!',`
  <div class="hero row between"><div><div class="sub">הושלמו</div><div class="lead">${f.done}/${f.total} סטים</div></div><div style="text-align:center"><div class="num">${signed(f.coins)}</div><div class="cap">מטבעות</div></div></div>

  <div class="card">${f.done===f.total?ref.feedback.full:ref.feedback.partial}</div>
  ${f.goal?`<div class="notice">🎯 השגת את היעד האישי! ${signed(ref.coins.goal)} מטבעות</div>`:''}
  ${f.chal?`<div class="notice">⭐ השלמת את האתגר השבועי! ${signed(ref.coins.challenge)} מטבעות</div>`:''}
  <button class="btn" data-a="tab" data-v="traineeHome">חזרה לבית</button>
  <button class="btn sec" data-a="go" data-v="myWorkouts">האימונים שלי ותיקון תוצאה</button>`,{backBtn:false})};

/* ----- S16 האימונים שלי ותיקון ----- */
screens.myWorkouts=()=>{

  return shell('היסטוריה','האימונים שלי',`
  ${list.length?list.map(([k,w])=>`<div class="card col"><div class="row between"><b>${fmtDay(w.date)} · ${wName(w.wid)}</b><button class="link" data-a="go" data-v="correct" data-p="${k}">תיקון</button></div>
   ${w.rows.map(r=>exLine(r,r.corrected?' <span class="badge warn">תוקן</span>':'')).join('')}
   ${notes[k]?`<div class="notice small">💬 הערת המאמן: ${notes[k]}</div>`:''}</div>`).join('')
   :empty('עוד אין אימונים','אחרי השמירה הראשונה, האימונים יופיעו כאן.',img('ריצה בפארק','short'))}`);

// תיקון מקובץ לפי תרגיל, עם כותרות עמודות, ובלי משקל בתרגיל משקל גוף (ממצא 10)
screens.correct=({id})=>{const rows=results.filter(r=>r.tid===S.me&&(r.date.toDateString()+r.wid)===id);return shell('תיקון תוצאה',`תיקון · ${fmtDay(rows[0].date)}`,`
  ${rows.map((r,ri)=>{const e=ex(r.ex);return `<div class="card col"><b>${e.name}</b>
   <div class="setrow muted small" aria-hidden="true"><span>סט</span><span>חזרות</span><span>${e.body?'':'משקל'}</span><span></span></div>
   ${r.sets.map((s,si)=>`<div class="setrow"><span class="mono">${si+1}</span><input type="number" inputmode="numeric" aria-label="${e.name}, סט ${si+1}, חזרות" value="${s.reps}" data-fix="${ri}|${si}|reps">${e.body?'<span></span>':`<input type="number" inputmode="decimal" aria-label="${e.name}, סט ${si+1}, משקל" value="${s.weight}" data-fix="${ri}|${si}|weight">`}<span></span></div>`).join('')}</div>`}).join('')}
  <div class="muted small">התיקון לא משנה את המטבעות, והמאמן יראה שהערך תוקן.</div>
  <button class="btn" data-a="saveFix" data-p="${id}">שמירת התיקון</button>`)};

/* ----- S21 גרף התקדמות (מקרה שימוש 5): ציר זמן לפי תאריך, עד ארבע תוויות (ממצא 29) ----- */
screens.progress=({id})=>{
  const tid=id||S.me; const p=programs[tid];
  const exIds=[...new Set(results.filter(r=>r.tid===tid).map(r=>r.ex))];
  const planEx=p?p.workouts.flatMap(w=>w.items.map(i=>i.ex)).filter(x=>exIds.includes(x)):[];
  const sel=S.params.pex&&exIds.includes(S.params.pex)?S.params.pex:(planEx[0]||exIds[0]);
  if(!sel) return shell(nm(tname(tid)),'גרף התקדמות',empty('הגרף יופיע אחרי האימונים הראשונים','כל אימון שנשמר מוסיף נקודה.'));
  const pts=chartPoints(tid,sel); const e=ex(sel);
  const W=340,H=190,P=30; const vals=pts.map(x=>x.v); const mn=Math.min(...vals)*0.9, mx=Math.max(...vals)*1.05||1;
  const t0=+pts[0].date, t1=+pts[pts.length-1].date, span=(t1-t0)||1;
  const X=q=>pts.length>1?P+(W-2*P)*((+q.date-t0)/span):W/2; // ציר זמן לפי תאריך, הישן משמאל כמקובל בגרפים
  const Y=v=>H-P-(H-2*P)*((v-mn)/((mx-mn)||1));
  const best=Math.max(...vals); const bi=vals.lastIndexOf(best);
  const labelIdx=[...new Set([0,Math.round((pts.length-1)/3),Math.round(2*(pts.length-1)/3),pts.length-1])];
  const chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="גרף התקדמות ב${e.name}: שיא ${best}${e.body?' חזרות':' ק&quot;ג'}">
    <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line-in)"/>
    <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map(q=>X(q)+','+Y(q.v)).join(' ')}"/>
    ${pts.map((q,i)=>`<circle cx="${X(q)}" cy="${Y(q.v)}" r="${i===bi?6:3.5}" fill="${i===bi?'var(--lime)':'var(--accent)'}" stroke="${i===bi?'var(--ink)':'none'}"/>`).join('')}
    ${labelIdx.map(i=>`<text x="${X(pts[i])}" y="${H-10}" text-anchor="middle">${fmt(pts[i].date)}</text>`).join('')}
    <text x="${X(pts[bi])}" y="${Y(best)-12}" text-anchor="middle">שיא ${best}</text></svg>`;
  const picker=exIds.length>4
    ? field('תרגיל',`<select data-a="pexSel">${exIds.map(x=>`<option value="${x}" ${x===sel?'selected':''}>${ex(x).name}</option>`).join('')}</select>`)
    : `<div class="row" style="flex-wrap:wrap;gap:6px">${exIds.map(x=>`<button class="pill ${x===sel?'on':''}" data-a="pex" data-v="${x}" aria-pressed="${x===sel}">${ex(x).name}</button>`).join('')}</div>`;
  return shell(nm(tname(tid)),'גרף התקדמות',`
  ${picker}
  <div class="grid2">${tile('שיא אישי',`${best}${e.body?'':' ק"ג'}`,fmtY(pts[bi].date))}${tile('אימונים',pts.length,`מאז ${fmt(pts[0].date)}`)}</div>
  <div class="card">${chart}<div class="muted small">${e.body?'מספר החזרות הגבוה בכל אימון (תרגיל משקל גוף)':'המשקל הגבוה בכל אימון, בק"ג'}. הנקודה המודגשת היא השיא האישי.</div></div>`);
};

screens.classesTrainee=()=>{const me=S.me;const up=classes.filter(c=>c.date>=new Date(TODAY.toDateString())).sort((a,b)=>a.date-b.date);return shell('שיעורים קבוצתיים','שיעורים',`

   ${c.cancelled?'<span class="badge warn">בוטל</span>':r?'<span class="badge ok">רשום</span>':w>=0?`<span class="badge warn">בהמתנה, מקום ${w+1}</span>`:''}</div>
   ${c.cancelled?'<div class="muted small">השיעור בוטל בידי המאמן.</div>':

   `<button class="btn sec small" data-a="register" data-p="${c.id}">הצטרפות להמתנה</button>`}</div>`}).join(''):empty('אין שיעורים קרובים','כשהמאמן יפרסם שיעור, הוא יופיע כאן.',img('אימון קבוצתי','short'))}</div>

screens.lateCancel=({id})=>{const c=classes.find(x=>x.id===id);return shell('ביטול מאוחר',`${fmtDay(c.date)} · ${c.time}`,`

/* ----- S18 מטבעות ותגמולים: אישור בשורה מלאה (ממצא 13) ----- */
screens.coins=()=>{const me=S.me;const bal=balance(me);const lbl={workout:'אימון',goal:'יעד אישי',challenge:'אתגר שבועי',attendance:'הגעה לשיעור',redeem:'מימוש'};const hist=coinLedger.filter(c=>c.tid===me).slice().reverse();return shell('מטבעות','מטבעות ותגמולים',`
  <div class="hero row between"><div><div class="lead">היתרה שלך</div><div class="sub" style="margin-top:3px">מטבעות על אימונים, יעדים, אתגרים והגעה לשיעורים</div></div><div style="text-align:center"><div class="num">${num(bal)}</div><div class="cap">מטבעות</div></div></div>
  <h2>תגמולים</h2>
  <div class="list">${rewards.map(r=>`<div class="card col"><div class="row between"><div><div style="font-size:15px">${r.name}</div><div class="muted small mono">${num(r.price)} מטבעות</div></div>
    ${S.params.confirmRedeem===r.id?'':bal>=r.price?`<button class="btn small" data-a="redeem" data-p="${r.id}">מימוש</button>`:`<span class="muted small">חסרים ${num(r.price-bal)}</span>`}</div>
    ${S.params.confirmRedeem===r.id?`<div class="confirm col"><div>לממש את "${r.name}"? אחרי המימוש יישארו ${num(bal-r.price)} מטבעות.</div><div class="row"><button class="btn small" data-a="redeem" data-p="${r.id}">אישור המימוש</button><button class="btn sec small" data-a="cancelRedeem">ביטול</button></div></div>`:''}</div>`).join('')}</div>
  <h2>היסטוריה</h2>
  <div class="card col">${hist.length?hist.map(c=>`<div class="row between small"><span>${lbl[c.type]||c.type} · ${fmt(c.date)}</span>${signed(c.amt)}</div>`).join(''):'<div class="muted small">עוד אין תנועות. המטבעות הראשונים מגיעים עם האימון הראשון.</div>'}</div>`)};

/* ----- S20 אתגר שבועי למתאמן ----- */
screens.challengeTrainee=()=>{const cp=challengeProgress(S.me);const done=!cp.exempt&&cp.value>=cp.target;return shell(`עד ${fmtDay(challenge.end)}`,'האתגר השבועי',`
  <div class="hero row between"><div><div class="sub">${challenge.name}</div><div class="lead" style="margin-top:4px">${cp.exempt?'פטור השבוע':done?'השלמת ✓':'בדרך ליעד'}</div><div class="sub" style="margin-top:4px">פרס: ${ref.coins.challenge} מטבעות + ${challenge.prize}</div></div>
   ${cp.exempt?'':`<div style="text-align:center"><div class="num">${cp.value}/${cp.target}</div><div class="cap">${challenge.type==='count'?'אימונים':'ק"ג'}</div></div>`}</div>
  <div class="muted small">${cp.exempt?'התרגיל של האתגר אינו בתוכנית שלך, ולכן האתגר השבוע לא חל עליך.':'ההשלמה נספרת לבד מהאימונים שנשמרים. אין צורך לדווח שוב.'}</div>`)};

/* ----- S19 תשלומים למתאמן ----- */
screens.paymentsTrainee=()=>{const list=payments.filter(p=>p.tid===S.me).sort((a,b)=>b.date-a.date);return shell('הדגמה, לא מתבצע חיוב','תשלומים',`
  <div class="list">${list.length?list.map(p=>`<div class="card col"><div class="row between"><span style="font-size:15px">${payLabel[p.type]}</span><span class="mono">₪${num(p.amount)}</span></div>
   <div class="muted small">${fmtY(p.date)}</div>
   ${p.status==='פתוחה'?`<span class="badge demo" style="align-self:flex-start">הדגמה: אין שדה כרטיס ולא מתבצע חיוב</span><button class="btn" data-a="payDemo" data-p="${p.id}" data-busy="מעבד...">תשלום לדוגמה</button>`:
   `<button class="btn sec small" style="align-self:flex-start" data-a="go" data-v="invoice" data-p="${p.id}">חשבונית ${p.invoice}</button>`}</div>`).join(''):empty('אין בקשות תשלום','כשהמאמן ישלח בקשת תשלום, היא תופיע כאן.')}</div>`)};

/* ================= פעולות ================= */
// פעולות שמשנות נתונים: כשהשרת לא זמין הן נכשלות ומדווחות כשל, ולא הצלחה (ממצא 3)
const MUTATING=new Set(['sendInvite','newProgram','saveTarget','doSwap','saveProgram','addExercise','attachLink','uploadOk','saveGoal','saveNote','createPayReq','payDemo','prizeDelivered','createChallenge','addReward','delivered','publishClass','saveAttendance','cancelClass','lateDecide','saveSettings','saveWorkout','saveFix','register','cancelReg','sendLate','offerYes','offerNo','redeem','markRead','acceptInvite']);
const actions={
  back, retry:()=>load(), tab:(v)=>setTab(v), go:(v,p)=>go(v,{id:p}), noop:()=>{},
  theme:()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;store.set('fitness-theme',t);render()},
  role:(v)=>{S.role=v;setTab(v==='coach'?'coachHome':'traineeHome')},
  signInDemo:()=>toast('באב הטיפוס הכניסה היא בבחירת תפקיד, למטה'),
  logout:()=>{S.role=null;S.tab=null;S.stack=[];render()},
  acceptInvite:()=>{const t=trainees.find(x=>x.id==='t4');t.joined=true;S.role='trainee';S.me='t4';setTab('traineeHome');toast('הצטרפת! המאמן יבנה לך תוכנית')},
  expiredInvite:()=>toast('ההזמנה כבר לא בתוקף. אפשר לבקש מהמאמן הזמנה חדשה'),
  sendInvite:(v)=>{const n=invName.value.trim(),m=invMail.value.trim();
    if(!n||(v==='mail'&&!/^\S+@\S+\.\S+$/.test(m)))return toast('פרט הקשר לא תקין. כדאי לבדוק ולנסות שוב');
    const t={id:'t'+uid(),name:n+' (דוגמה)',joined:false,invite:{link:'https://example.com/fitness-app/?join='+uid(),until:addDays(TODAY,ref.inviteValidDays)}};trainees.push(t);
    S.stack.pop();if(v==='mail'){render();toast('ההזמנה נשלחה במייל')}else go('inviteDone',{id:t.id})},
  shareInvite:(p)=>{const t=trainees.find(x=>x.id===p);if(navigator.share)navigator.share({title:'הזמנה לאפליקציית האימונים',url:t.invite.link}).catch(()=>{});else actions.copyInvite(p)},
  copyInvite:(p)=>{const t=trainees.find(x=>x.id===p);
    (navigator.clipboard?navigator.clipboard.writeText(t.invite.link):Promise.reject()).then(()=>toast('הקישור הועתק'),()=>toast('ההעתקה לא הצליחה. אפשר לסמן את הקישור ולהעתיק ידנית'))}, // "הועתק" רק כשהצליח (ממצא 5)
  askNew:(p)=>{S.params.confirmNew=p;render()},
  cancelNew:()=>{S.params.confirmNew=null;render()},
  newProgram:(p)=>{S.params.confirmNew=null;if(programs[p]){(inactivePrograms[p]=inactivePrograms[p]||[]).push({name:'תוכנית קודמת',from:addDays(TODAY,-30)})}
    programs[p]={active:true,workouts:[{id:'w'+uid(),name:'אימון A',items:[]}]};render();toast('נפתחה תוכנית חדשה. הקודמת נשמרה כלא פעילה')},
  addWorkout:(p)=>{const w=programs[p].workouts;w.push({id:'w'+uid(),name:'אימון '+'ABCDEFG'[w.length],items:[]});render()},
  addItem:(p)=>{const [tid,wi]=p.split('|');programs[tid].workouts[wi].items.push({ex:'e7',sets:3,reps:10,weight:20});
    go('itemTarget',{id:`${tid}|${wi}|${programs[tid].workouts[wi].items.length-1}`})},
  saveTarget:(p)=>{const [tid,wi,ii]=p.split('|');const it=programs[tid].workouts[wi].items[ii];
    const s=+tS.value,r=+tR.value,w=+tW.value; if(!(s>0&&r>0&&w>=0))return toast('חסר מידע בתרגיל. צריך סטים, חזרות ומשקל');
    Object.assign(it,{sets:s,reps:r,weight:w});back();toast('היעד נשמר')},
  doSwap:(p)=>{const [tid,wi,ii,e]=p.split('|');programs[tid].workouts[wi].items[ii].ex=e;S.stack.pop();go('itemTarget',{id:`${tid}|${wi}|${ii}`});toast('התרגיל הוחלף באותו מקום')},
  saveProgram:(p)=>{const bad=programs[p].workouts.some(w=>!w.items.length);if(bad)return toast('יש אימון בלי תרגילים. צריך להוסיף תרגיל או למחוק את האימון');toast('התוכנית נשמרה, והמתאמן כבר רואה אותה')},
  addExercise:()=>{const n=exName.value.trim();if(!n)return toast('חסר שם לתרגיל');exercises.push({id:'e'+uid(),name:n,body:exBody.checked,video:null});back();toast('התרגיל נוסף לרשימה')},
  attachLink:(p)=>{const v=vidLink.value.trim();if(!/^https?:\/\//.test(v))return toast('זה לא נראה כמו סרטון. כדאי לנסות קישור אחר');ex(p).video='youtube';render();toast('הסרטון צורף, ומופיע בכל התוכניות')},
  uploadOk:(p)=>{ex(p).video='upload';render();toast('הסרטון עלה (דוגמה)')},
  uploadLong:()=>toast(`אפשר להעלות סרטון ${videoLimit()}`),
  saveGoal:(p)=>{const v=+gVal.value;if(!(v>0))return toast('חסר משקל יעד');goals[p]={ex:gEx.value,value:v,status:'פעיל'};back();toast('היעד נשמר')},
  saveNote:(p)=>{const t=noteTxt.value.trim();if(!t||t.length>ref.noteMax)return toast('ההערה ריקה או ארוכה מדי. אפשר לקצר ולנסות שוב');
    const [tid,k]=p.split(/\|(.+)/);notes[k]=t;(inbox[tid]=inbox[tid]||[]).unshift({id:'n'+uid(),text:'המאמן הוסיף הערה לאימון שלך',date:TODAY});back();toast('ההערה נשמרה, והמתאמן יראה אותה')},
  createPayReq:()=>{payments.push({id:'p'+uid(),tid:prT.value,type:prType.value,amount:ref.prices[prType.value],status:'פתוחה',date:TODAY,invoice:null});back();toast('בקשת התשלום נשלחה למתאמן')},
  payDemo:(p)=>{const x=payments.find(y=>y.id===p);if(x.status==='שולמה')return toast('הבקשה הזו כבר שולמה');x.status='שולמה';x.invoice=invoiceSeq++;render();toast('התשלום לדוגמה הושלם, וחשבונית נוצרה')},
  prizeDelivered:(p)=>{challenge.completions.find(c=>c.tid===p).delivered=true;render();toast('סומן: הפרס נמסר')},
  chType:(v)=>{document.querySelectorAll('#chType button').forEach(b=>{b.classList.toggle('on',b.dataset.v===v);b.setAttribute('aria-pressed',b.dataset.v===v)});S.params.chType=v},
  createChallenge:()=>toast('כבר יש אתגר השבוע. אפשר ליצור את הבא בשבוע הבא'),
  addReward:()=>{const n=rwName.value.trim(),pr=+rwPrice.value;if(!n||!(pr>0))return toast('חסר שם או מחיר');rewards.push({id:'rw'+uid(),name:n,price:pr});render();toast('התגמול נוסף לקטלוג')},
  delivered:(p)=>{redemptions.find(r=>r.id===p).status='סופק';render();toast('סומן: התגמול סופק')},
  publishClass:()=>{const cap=+clCap.value;if(!(cap>0)||!clPlace.value.trim())return toast('חסרים פרטים בשיעור. צריך להשלים ולנסות שוב');
    classes.push({id:'c'+uid(),date:new Date(clDate.value+'T00:00'),time:clTime.value,place:clPlace.value,cap,reg:[],wait:[],attended:null,cancelled:false});back();toast('השיעור פורסם')},
  toggleAtt:(p)=>{const [cid,t]=p.split('|');const c=classes.find(x=>x.id===cid);c.attended=c.attended||[];c.attended=c.attended.includes(t)?c.attended.filter(x=>x!==t):[...c.attended,t];render()},
  saveAttendance:(p)=>{const c=classes.find(x=>x.id===p);let n=0;(c.attended||[]).forEach(t=>{if(award(t,'attendance','att-'+p+t))n++});toast(n?`הנוכחות נשמרה. ${n} מתאמנים קיבלו מטבעות`:'הנוכחות נשמרה')},
  cancelClass:(p)=>{const c=classes.find(x=>x.id===p);c.cancelled=true;[...c.reg,...c.wait].forEach(t=>(inbox[t]=inbox[t]||[]).unshift({id:'n'+uid(),text:`השיעור ב${fmtDay(c.date)} בוטל בידי המאמן`,date:TODAY}));render();toast('השיעור בוטל, והנרשמים קיבלו הודעה')},
  lateDecide:(p)=>{const [id,d]=p.split('|');const r=lateRequests.find(x=>x.id===id);r.status=d==='ok'?'אושרה':'נדחתה';
    const c=classes.find(x=>x.id===r.cid);if(d==='ok'){c.reg=c.reg.filter(t=>t!==r.tid);offerNext(c)}
    (inbox[r.tid]=inbox[r.tid]||[]).unshift({id:'n'+uid(),text:`בקשת הביטול שלך ${r.status}`,date:TODAY});render();toast(`הבקשה ${r.status}`)},
  saveSettings:()=>{const bad=[...document.querySelectorAll('input[data-ref]')].find(i=>i.value===''||isNaN(+i.value)||+i.value<0);
    if(bad)return toast(`הערך ב"${document.querySelector(`label[for="${bad.id}"]`).textContent}" אינו מספר תקין`); // ממצא 14: אומרים איזה שדה
    document.querySelectorAll('[data-ref]').forEach(i=>{const k=i.dataset.ref.split('.');let o=ref;while(k.length>1)o=o[k.shift()];o[k[0]]=i.type==='number'?+i.value:i.value});toast('ההגדרות נשמרו')},
  // מתאמן
  startWorkout:(p)=>{draft=null;go('workout',{id:p})},
  toggleSet:(p)=>{const [ii,si]=p.split('|');const s=draft.items[ii].sets[si];s.done=!s.done;render()},
  saveWorkout:()=>{
    for(const it of draft.items)for(const s of it.sets)if(!(s.reps>=0&&s.weight>=0)||isNaN(s.reps))return toast('יש ערך לא תקין באחד הסטים. כדאי לבדוק ולנסות שוב');
    const me=S.me,d=new Date(TODAY),prs=[];let done=0,total=0;
    draft.items.forEach(it=>{const e=ex(it.ex);const prev=chartPoints(me,it.ex).map(x=>x.v);const v=e.body?Math.max(...it.sets.filter(s=>s.done).map(s=>+s.reps),0):Math.max(...it.sets.filter(s=>s.done).map(s=>+s.weight),0);
      if(prev.length&&v>Math.max(...prev))prs.push(e.name);
      it.sets.forEach(s=>{total++;if(s.done)done++});
      results.push({tid:me,date:d,wid:draft.wid,ex:it.ex,sets:it.sets.map(s=>({...s})),corrected:false})});
    const refId='w-'+uid();const coins=award(me,'workout',refId);
    let goal=false;const g=goals[me];if(g&&g.status==='פעיל'){const it=draft.items.find(i=>i.ex===g.ex);if(it&&Math.max(...it.sets.map(s=>+s.weight))>=g.value){g.status='הושג, ממתין ליעד חדש';award(me,'goal','g-'+refId);goal=true}}
    let chal=false;const cp=challengeProgress(me);if(!cp.exempt&&cp.value>=cp.target&&!challenge.completions.some(c=>c.tid===me)){challenge.completions.push({tid:me,delivered:false});award(me,'challenge','ch-'+challenge.id+me);chal=true}
    draft=null;S.stack=[{screen:'feedback',params:{id:{done,total,prs,coins,goal,chal}}}];window.scrollTo(0,0);render()},
  saveFix:(p)=>{const rows=results.filter(r=>r.tid===S.me&&(r.date.toDateString()+r.wid)===p);
    document.querySelectorAll('[data-fix]').forEach(i=>{const [ri,si,f]=i.dataset.fix.split('|');const s=rows[ri].sets[si];if(+i.value!==+s[f]){s[f]=+i.value;rows[ri].corrected=true}});
    back();toast('התיקון נשמר. המטבעות לא השתנו, והמאמן יראה שהערך תוקן')},
  pex:(v)=>{S.params.pex=v;render()},
  register:(p)=>{const c=classes.find(x=>x.id===p),me=S.me;if(c.reg.includes(me)||c.wait.includes(me))return toast('כבר יש הרשמה לשיעור הזה');
    if(c.reg.length<c.cap){c.reg.push(me);toast('נרשמת לשיעור')}else{c.wait.push(me);toast(`השיעור מלא. נכנסת לרשימת ההמתנה, מקום ${c.wait.length}`)}render()},
  cancelReg:(p)=>{const c=classes.find(x=>x.id===p),me=S.me;const [hh,mm]=c.time.split(':');const start=new Date(c.date);start.setHours(+hh,+mm);const hrs=(start-TODAY)/36e5;
    if(hrs<ref.cancelHours){go('lateCancel',{id:p});return}
    c.reg=c.reg.filter(t=>t!==me);offerNext(c);render();toast('ההרשמה בוטלה')},
  sendLate:(p)=>{if(!lateRequests.some(r=>r.tid===S.me&&r.cid===p&&r.status==='ממתינה'))lateRequests.push({id:'l'+uid(),tid:S.me,cid:p,status:'ממתינה'});back();toast('הבקשה נשלחה למאמן')},
  cancelRedeem:()=>{S.params.confirmRedeem=null;render()},
  offerYes:(p)=>{const c=classes.find(x=>x.id===p);c.wait=c.wait.filter(t=>t!==S.me);c.reg.push(S.me);c.offer=null;render();toast('נרשמת לשיעור')},
  offerNo:(p)=>{const c=classes.find(x=>x.id===p);c.wait=c.wait.filter(t=>t!==S.me);c.offer=null;offerNext(c);render();toast('המקום הוצע לבא בתור')},
  markRead:(p)=>{inbox[S.me]=(inbox[S.me]||[]).filter(m=>m.id!==p);render()},
  redeem:(p)=>{const r=rewards.find(x=>x.id===p),me=S.me;if(balance(me)<r.price)return toast(`אין מספיק מטבעות. חסרים לך עוד ${num(r.price-balance(me))}`);
    if(S.params.confirmRedeem!==p){S.params.confirmRedeem=p;render();return}
    S.params.confirmRedeem=null;
    coinLedger.push({tid:me,type:'redeem',amt:-r.price,date:TODAY,ref:'rd-'+uid()});redemptions.push({id:'rd'+uid(),tid:me,reward:p,status:'ממתין לאספקה',date:TODAY});render();toast('מימשת! המאמן יספק את התגמול')},
};
function offerNext(c){ if(c.wait.length&&c.reg.length<c.cap){c.offer={tid:c.wait[0],until:ref.spotOfferHours};(inbox[c.wait[0]]=inbox[c.wait[0]]||[]).unshift({id:'n'+uid(),text:`התפנה מקום בשיעור ב${fmtDay(c.date)}`,date:TODAY})} }

/* ---- חיבור אירועים ---- */
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;const name=b.dataset.a;const f=actions[name];if(!f)return;
  const run=()=>{
    if(S.offline&&MUTATING.has(name)&&!(name==='redeem'&&S.params.confirmRedeem!==b.dataset.p))return toast('אין חיבור כרגע, ולכן הפעולה לא נשמרה. אפשר לנסות שוב');
    f(b.dataset.v??b.dataset.p,b.dataset.p)};
  if(b.dataset.busy){const t=b.textContent;b.disabled=true;b.textContent=b.dataset.busy;setTimeout(()=>{b.disabled=false;b.textContent=t;run()},700)} // כפתור "שולח" (ממצא 16)
  else run()});
app.addEventListener('change',e=>{if(e.target.dataset.a==='pexSel'){S.params.pex=e.target.value;render()}});
app.addEventListener('input',e=>{const i=e.target;if(i.dataset.set){const [ii,si,f]=i.dataset.set.split('|');draft.items[ii].sets[si][f]=i.value===''?NaN:+i.value}});
document.getElementById('pSid').addEventListener('change',e=>{S.sid=e.target.checked;render()});
document.getElementById('pOff').addEventListener('change',e=>{S.offline=e.target.checked;render()});
document.getElementById('pOut').addEventListener('click',()=>actions.logout());
function render(){fid=0;const c=cur();app.innerHTML=(screens[c.screen]||screens.signIn)(c.params||{})}
render();
</script>
