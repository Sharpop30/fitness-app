# The site to GitHub Pages (CLAUDE.md sections 3 and 5; stage 7 plan, tasks 17 and 24).
# On every push to main: Node 20, npm ci, Vitest, the build with the three public values from Secrets, and a check that
# no secret key reached the built files (CLAUDE.md section 9, test 8). The deploy job runs only once the team has
# approved deploying and turned Pages on: the repository variable PAGES_ENABLED is "true" (stage 7c). Until then the
# workflow only builds.
# Stage 8a, task 1: the actions are on versions that run on Node 24 (checked against GitHub, 03.10.2026), and the
# runner is pinned to ubuntu-24.04 so the move of ubuntu-latest to Ubuntu 26 does not change the build unannounced.
# The app itself stays on Node 20 (CLAUDE.md section 3).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Vitest
        run: npx vitest run
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - name: No secret key in the built files
        run: |
          if grep -rlE 'service_role|sb_secret_|sbp_[A-Za-z0-9]{20,}' dist; then
            echo "A secret key pattern is in the built site" && exit 1
          fi
          # A JWT key is base64, so its role is not in plain text: decode every one, and only "anon" may be there
          # (stage 7c: the pattern above would miss a service_role JWT pasted by mistake).
          grep -rhoE 'eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' dist | sort -u | node -e '
            const keys = require("fs").readFileSync(0, "utf8").split(/\s+/).filter(Boolean);
            for (const k of keys) {
              const role = JSON.parse(Buffer.from(k.split(".")[1], "base64url").toString()).role;
              if (role !== "anon") { console.log(`A key with role "${role}" is in the built site`); process.exit(1); }
            }
            console.log(`${keys.length} key(s) in the built site, all anon`);'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
