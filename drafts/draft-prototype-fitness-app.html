<title>אב טיפוס אפליקציית מאמן</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Heebo:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== מודול העיצוב (Design System): אסימונים מ-FORM, reference/form/README.md ===== */
:root{
  --page:#e8e8e3; --bg:#f4f4f1; --card:#ffffff; --ink:#161916; --muted:#555a53; --muted2:#6e726b; --muted3:#8b8f88;
  --line:#e8e8e3; --line-in:#e0e0da; --tint:#eef8d6; --tint2:#e2f5c4; --tintInk:#1d3a12; --warn:#fdf0e2;
  --chip:#f0f0ec; --seg:#e6e6e0; --hero:#13261a; --heroSub:#b9c4bb; --sel:#13261a; --selFg:#fff;
  --accent:#2c8a4b; --lime:#c3f03f; --orange:#d9822b; --danger:#b3261e; --demo:#fff4c2; --demoInk:#5b4a00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0b0d0b; --bg:#121512; --card:#1b1f1b; --ink:#eef0ea; --muted:#a3a89f; --muted2:#a3a89f; --muted3:#8b8f88;
    --line:#2c312c; --line-in:#2c312c; --tint:#1f3324; --tint2:#28432d; --tintInk:#d4f0a6; --warn:#3a2b1b;
    --chip:#262b26; --seg:#232823; --hero:#1f3527; --sel:#c3f03f; --selFg:#15260c; --accent:#7fd08f; --demo:#3a3410; --demoInk:#f3e39a;
    color-scheme:dark;
  }
}
[data-theme="dark"]{color-scheme:dark}
:root[data-theme="dark"]{
  --page:#0b0d0b; --bg:#121512; --card:#1b1f1b; --ink:#eef0ea; --muted:#a3a89f; --muted2:#a3a89f; --muted3:#8b8f88;
  --line:#2c312c; --line-in:#2c312c; --tint:#1f3324; --tint2:#28432d; --tintInk:#d4f0a6; --warn:#3a2b1b;
  --chip:#262b26; --seg:#232823; --hero:#1f3527; --sel:#c3f03f; --selFg:#15260c; --accent:#7fd08f; --demo:#3a3410; --demoInk:#f3e39a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:Geist,Heebo,system-ui,sans-serif;font-size:14px;line-height:1.45}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media (min-width:600px){.app{box-shadow:0 30px 80px rgba(20,30,20,.18);margin:16px auto;min-height:calc(100vh - 32px);border-radius:28px;overflow:hidden}}
.demo-bar{background:var(--demo);color:var(--demoInk);font-size:12px;padding:6px 16px;text-align:center}
header.hd{background:var(--card);padding:6px 20px 16px}
.back{color:var(--accent);background:none;border:0;font-size:16px;padding:6px 0;cursor:pointer;font-family:inherit}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-top:6px}
h1{font-size:27px;font-weight:500;letter-spacing:-.01em;line-height:1.15;margin:4px 0 0}
main{flex:1;padding:16px 18px 28px;display:flex;flex-direction:column;gap:12px;animation:enter .28s ease}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:18px;font-weight:500;margin:8px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.hero{background:var(--hero);color:#fff;border-radius:16px;padding:16px}
.hero .sub{color:var(--heroSub);font-size:13px}
.hero .big{font-size:20px;font-weight:500;font-family:"Geist Mono",Geist,monospace}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between;cursor:pointer;text-align:right;width:100%;font-family:inherit;color:inherit;font-size:14px}
.item:hover{border-color:var(--line-in)}
.muted{color:var(--muted)} .small{font-size:12px} .mono{font-family:"Geist Mono",monospace}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--chip);border:1px solid var(--line)}
.badge.ok{background:var(--tint2);color:var(--tintInk);border-color:transparent}
.badge.warn{background:var(--warn);border-color:transparent}
.badge.demo{background:var(--demo);color:var(--demoInk);border-color:transparent}
.btn{height:50px;width:100%;border-radius:999px;border:0;background:var(--lime);color:#161916;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.small{height:36px;width:auto;padding:0 16px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);cursor:pointer;font-family:inherit;font-size:13px;padding:0}
input,select,textarea{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-in);background:var(--card);color:var(--ink)}
label{font-size:12px;color:var(--muted2);display:block;margin-bottom:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg{display:flex;background:var(--seg);border-radius:999px;padding:3px;gap:4px}
.seg button{flex:1;height:32px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:500}
.setrow{display:grid;grid-template-columns:44px 1fr 1fr 34px;gap:6px;align-items:center}
.setrow input{padding:8px;text-align:center}
.check{width:34px;height:34px;border-radius:10px;border:1px solid var(--line-in);background:var(--card);cursor:pointer}
.check.on{background:var(--tint2);border-color:transparent}
.question{margin-top:auto;border-top:1px dashed var(--line-in);padding-top:10px;font-size:12px;color:var(--muted2)}
.assume{font-size:11px;color:var(--orange)}
nav.tabs{position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--card);border-top:1px solid var(--line)}
nav.tabs button{flex:1;padding:10px 4px 14px;border:0;background:none;color:#8b8f88;font-family:inherit;font-size:12px;cursor:pointer}
nav.tabs button.on{color:var(--accent);font-weight:500}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--hero);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,-8px)}
.pill{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-family:inherit;color:var(--ink)}
.pill.on{background:var(--sel);color:var(--selFg);border-color:transparent}
.video{background:#000;color:#fff;border-radius:14px;height:170px;display:flex;align-items:center;justify-content:center;font-size:13px;text-align:center;padding:12px}
.notice{background:var(--tint);border-radius:14px;padding:12px 14px}
.warnbox{background:var(--warn);border-radius:14px;padding:12px 14px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
svg text{fill:var(--muted2);font-size:10px;font-family:"Geist Mono",monospace}
header.hd{position:relative}
.theme{position:absolute;top:10px;left:16px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink);font-family:inherit}
</style>
<div dir="rtl" lang="he">
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
</div>
<script>
/* ============================================================
   אב טיפוס, גרסה 1. נתונים סינתטיים בלבד (חוק 2, tofrot-projekt).
   המקורות: doc-mlp-scope, 11 סיפורי המשתמש ו-11 מקרי השימוש.
   ============================================================ */
const TODAY = new Date(2026, 8, 28); // יום שני, 28.09.2026 [נתוני דוגמה]
const fmt = d => d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'});
const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const uid = ()=>Math.random().toString(36).slice(2,8);

/* ---- טבלת הייחוס: ערכים שהמאמן משנה בלי קוד ---- */
const ref = {
  coins:{workout:10, goal:30, challenge:50, attendance:5},          // [הנחת עיצוב, לאישור]: הכמויות
  prices:{monthly:350, pack10:600},                                 // [הנחת עיצוב, לאישור]: המחירים
  cancelHours:24, streakGapDays:3, videoMaxSec:60, spotOfferHours:2, // 2 שעות לשמירת מקום: [הנחת עיצוב, לאישור]
  feedback:{
    full:'כל הכבוד! השלמת את כל הסטים לפי התוכנית.',
    partial:'עבודה טובה. כל סט נחשב, ממשיכים באימון הבא.',
    pr:'שיא אישי חדש! ההתקדמות שלך נראית.'
  },
  reminder:'יום טוב! הנה מה שמחכה לך היום.'
};

/* ---- נתוני דוגמה ---- */
const exercises = [
  {id:'e1',name:'סקוואט',body:false,video:'youtube'},
  {id:'e2',name:'לחיצת חזה',body:false,video:'youtube'},
  {id:'e3',name:'חתירה בכבל',body:false,video:'youtube'},
  {id:'e4',name:'מכרעים',body:false,video:'youtube'},
  {id:'e5',name:'שכיבות סמיכה',body:true,video:'youtube'},
  {id:'e6',name:'דדליפט רומני',body:false,video:'youtube'},
  {id:'e7',name:'לחיצת כתפיים',body:false,video:null},
  {id:'e8',name:'מתח',body:true,video:'youtube'},
];
const ex = id => exercises.find(e=>e.id===id);

const trainees = [
  {id:'t1',name:'נועה (דוגמה)',joined:true},
  {id:'t2',name:'איתי (דוגמה)',joined:true},
  {id:'t3',name:'מאיה (דוגמה)',joined:true},
  {id:'t4',name:'רון (דוגמה)',joined:false,invite:{channel:'קישור ומייל',sent:addDays(TODAY,-1)}},
];

const programs = { // תוכנית פעילה אחת למתאמן. קודמות נשמרות כלא פעילות.
  t1:{active:true,workouts:[
    {id:'w1',name:'אימון A',items:[{ex:'e1',sets:3,reps:8,weight:60},{ex:'e2',sets:3,reps:8,weight:40},{ex:'e5',sets:3,reps:12,weight:0}]},
    {id:'w2',name:'אימון B',items:[{ex:'e6',sets:3,reps:10,weight:50},{ex:'e3',sets:3,reps:10,weight:35},{ex:'e8',sets:3,reps:6,weight:0}]}]},
  t2:{active:true,workouts:[{id:'w3',name:'אימון מלא',items:[{ex:'e4',sets:3,reps:10,weight:12},{ex:'e2',sets:4,reps:6,weight:55}]}]},
  t3:null
};
const inactivePrograms = {t1:[{name:'תוכנית קודמת',until:addDays(TODAY,-40)}]};

// היסטוריית תוצאות למתאמן t1, לגרף
const results = []; // {tid,date,wid,ex,sets:[{reps,weight,done}],corrected}
(function seed(){
  const base={e1:50,e2:32,e5:0,e6:40,e3:28,e8:0};
  for(let i=8;i>=1;i--){
    const d=addDays(TODAY,-i*3);
    const w=i%2?programs.t1.workouts[0]:programs.t1.workouts[1];
    w.items.forEach(it=>{
      const wt=it.weight?Math.round(base[it.ex]+(8-i)*1.5):0;
      const reps=it.weight?it.reps:it.reps-Math.round(i/2);
      results.push({tid:'t1',date:d,wid:w.id,ex:it.ex,sets:Array.from({length:it.sets},(_,k)=>({reps,weight:wt+(k===it.sets-1?2.5:0),done:true})),corrected:false,note:null});
    });
  }
})();

const coinLedger=[ // יומן תנועות. היתרה מחושבת ממנו
  {tid:'t1',type:'workout',amt:10,date:addDays(TODAY,-3),ref:'r-a'},
  {tid:'t1',type:'workout',amt:10,date:addDays(TODAY,-6),ref:'r-b'},
  {tid:'t1',type:'attendance',amt:5,date:addDays(TODAY,-5),ref:'c-x'},
  {tid:'t1',type:'challenge',amt:50,date:addDays(TODAY,-8),ref:'ch-0'},
];
const rewards=[{id:'rw1',name:'כרטיסייה בהנחה',price:120},{id:'rw2',name:'אימון אישי חינם',price:200},{id:'rw3',name:'בקבוק מים ממותג',price:60}];
const redemptions=[{id:'rd1',tid:'t2',reward:'rw3',status:'ממתין לאספקה',date:addDays(TODAY,-1)}];
const goals={t1:{ex:'e1',value:65,status:'פעיל'}};

let invoiceSeq=1003;
const payments=[
  {id:'p1',tid:'t1',type:'monthly',amount:350,status:'שולמה',date:addDays(TODAY,-20),invoice:1001},
  {id:'p2',tid:'t2',type:'pack10',amount:600,status:'שולמה',date:addDays(TODAY,-10),invoice:1002},
  {id:'p3',tid:'t1',type:'pack10',amount:600,status:'פתוחה',date:addDays(TODAY,-1),invoice:null},
];
const payLabel={monthly:'מנוי חודשי',pack10:'חבילת 10 אימונים (כרטיסייה)'};

const weekStart = addDays(TODAY,-TODAY.getDay()); // יום ראשון
const challenge={id:'ch1',name:'שלושה אימונים השבוע',type:'count',target:3,ex:null,prize:'בקבוק מים ממותג',start:weekStart,end:addDays(weekStart,6),completions:[{tid:'t2',delivered:false}]};

const classes=[
  {id:'c1',date:addDays(TODAY,0),time:'18:30',place:'פארק הירקון',cap:8,reg:['t1','t2','t3'],wait:[],attended:null,cancelled:false},
  {id:'c2',date:addDays(TODAY,2),time:'07:00',place:'סטודיו',cap:3,reg:['t2','t3','t4'],wait:['t1'],attended:null,cancelled:false},
  {id:'c3',date:addDays(TODAY,4),time:'19:00',place:'סטודיו',cap:10,reg:['t2'],wait:[],attended:null,cancelled:false},
  {id:'c0',date:addDays(TODAY,-2),time:'18:30',place:'פארק הירקון',cap:8,reg:['t1','t2','t3'],wait:[],attended:null,cancelled:false},
];
const lateRequests=[]; // בקשות ביטול חריגות
const notes={}; // הערות מאמן לפי מזהה אימון שבוצע
const inbox={t1:[{text:'המאמן הוסיף הערה לאימון האחרון שלך',date:addDays(TODAY,-1)}]};

/* ---- מצב ה-UI ---- */
const S={role:null, me:'t1', stack:[], tab:null, params:{}};
const app=document.getElementById('app');

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400)}
function go(screen,params={}){S.stack.push({screen,params});render();window.scrollTo(0,0)}
function back(){S.stack.pop();render()}
function setTab(t){S.tab=t;S.stack=[{screen:t,params:{}}];render()}
const cur=()=>S.stack[S.stack.length-1]||{screen:'welcome',params:{}};
const tname=id=>(trainees.find(t=>t.id===id)||{}).name;

/* ---- חישובים (Business Logic, בקוד רגיל) ---- */
const balance=tid=>coinLedger.filter(c=>c.tid===tid).reduce((a,c)=>a+c.amt,0);
function award(tid,type,refId){
  if(coinLedger.some(c=>c.ref===refId&&c.type===type))return 0; // זיכוי אחד לכל אירוע
  const amt=ref.coins[type]; coinLedger.push({tid,type,amt,date:new Date(),ref:refId}); return amt;
}
function chartPoints(tid,exId){
  const e=ex(exId); const rows=results.filter(r=>r.tid===tid&&r.ex===exId).sort((a,b)=>a.date-b.date);
  return rows.map(r=>({date:r.date,v:e.body?Math.max(...r.sets.map(s=>+s.reps||0)):Math.max(...r.sets.map(s=>+s.weight||0)),corrected:r.corrected}));
}
function streak(tid){
  const days=[...new Set(results.filter(r=>r.tid===tid).map(r=>r.date.toDateString()))].map(s=>new Date(s)).sort((a,b)=>b-a);
  if(!days.length)return 0;
  if((TODAY-days[0])/864e5>ref.streakGapDays)return 0;
  let n=1; for(let i=1;i<days.length;i++){ if((days[i-1]-days[i])/864e5<=ref.streakGapDays)n++; else break;} return n;
}
function challengeProgress(tid){
  if(challenge.type==='exercise'){
    const p=programs[tid]; const inPlan=p&&p.workouts.some(w=>w.items.some(i=>i.ex===challenge.ex));
    if(!inPlan)return {exempt:true};
    const best=Math.max(0,...results.filter(r=>r.tid===tid&&r.ex===challenge.ex&&r.date>=challenge.start).flatMap(r=>r.sets.map(s=>+s.weight)));
    return {value:best,target:challenge.target};
  }
  const n=new Set(results.filter(r=>r.tid===tid&&r.date>=challenge.start&&r.date<=addDays(challenge.end,1)).map(r=>r.date.toDateString()+r.wid)).size;
  return {value:n,target:challenge.target};
}

/* ---- תבניות משותפות ---- */
const Q = q=>`<div class="question">השאלה שהמסך בודק: ${q}</div>`;
const A = t=>`<div class="assume">[הנחת עיצוב, לאישור] ${t}</div>`;
function shell(eyebrow,title,body,{backBtn=true}={}){
  const tabs = S.role==='coach'
    ? [['coachHome','בית'],['trainees','מתאמנים'],['classesCoach','שיעורים'],['more','עוד']]
    : S.role==='trainee' ? [['traineeHome','בית'],['workoutPick','אימון'],['classesTrainee','שיעורים'],['me','אני']] : [];
  return `<div class="demo-bar">אב טיפוס, גרסה 1. כל הנתונים הם נתוני דוגמה. תשלומים וחשבוניות הם הדגמה בלבד.</div>
  <header class="hd">${S.stack.length>1&&backBtn?`<button class="back" data-a="back">‹ חזרה</button>`:'<div style="height:30px"></div>'}
  <button class="theme" data-a="theme">מצב כהה/בהיר</button>
  <div class="eyebrow">${eyebrow}</div><h1>${title}</h1></header>
  <main>${body}</main>
  ${tabs.length?`<nav class="tabs">${tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-v="${k}">${l}</button>`).join('')}</nav>`:''}`;
}

/* ================= מסכים ================= */
const screens={};

screens.welcome=()=>shell('הדגמה','בחירת תפקיד',`
  <div class="hero"><div class="sub">אפליקציה אחת למאמן כושר אישי ולמתאמנים שלו</div><div class="big" style="margin-top:6px">תוכניות, תשלומים ומעקב במקום אחד</div></div>
  <button class="btn" data-a="role" data-v="coach">כניסה כמאמן</button>
  <button class="btn sec" data-a="role" data-v="trainee">כניסה כמתאמן</button>
  <button class="btn sec" data-a="go" data-v="joinInvite">פתיחת הזמנה כמתאמן חדש</button>
  <div class="muted small">מסך הבחירה קיים רק באב הטיפוס. באפליקציה, חשבון המאמן נוצר מראש, והמתאמן מצטרף בהזמנה.</div>
  ${Q('האם ברור לכם מה האפליקציה עושה, עוד לפני שנכנסים?')}`,{backBtn:false});

/* ----- מתאמן חדש: הצטרפות בהזמנה (מקרה שימוש 4) ----- */
screens.joinInvite=()=>shell('הזמנה מהמאמן','הצטרפות',`
  <div class="notice">המאמן שלך הזמין אותך להצטרף. ההזמנה הגיעה בקישור או במייל.</div>
  <div><label>שם</label><input value="רון (דוגמה)"></div>
  <div><label>מייל</label><input value="ron@example.com"></div>
  <div><label>סיסמה</label><input type="password" value="demo-password"></div>
  <div class="assume">[הנחת עיצוב, לאישור] ההרשמה עצמה בשירות הזהות של Supabase. כאן היא מדומה.</div>
  <button class="btn" data-a="acceptInvite">הצטרפות</button>
  <button class="link" data-a="expiredInvite">מה רואים כשההזמנה פגה?</button>

screens.invite=()=>shell('מתאמן חדש','הזמנת מתאמן',`
  <div><label>שם המתאמן</label><input id="invName" placeholder="לדוגמה: דנה"></div>
  <div><label>מייל (לשליחת ההזמנה)</label><input id="invMail" placeholder="name@example.com"></div>

   <button class="item" data-a="go" data-v="goalEdit" data-p="${id}"><span>יעד אישי</span><span class="muted small">${g?ex(g.ex).name+' '+g.value+' ק"ג · '+g.status:'אין יעד'}</span></button>

/* ----- תוכנית אימון (מקרה שימוש 1) ----- */
screens.programEdit=({id})=>{
  const p=programs[id];
  if(!p) return shell('תוכנית אימון','בניית תוכנית',`
    <div class="empty">למתאמן עוד אין תוכנית.</div>
    <button class="btn" data-a="newProgram" data-p="${id}">בניית תוכנית חדשה</button>
    ${Q('האם ברור איך מתחילים לבנות תוכנית?')}`);
  const inactive=(inactivePrograms[id]||[]);
  return shell(tname(id),'תוכנית אימון',`
  ${p.workouts.map((w,wi)=>`<div class="card col"><div class="row between"><b>${w.name}</b><button class="link" data-a="addItem" data-p="${id}|${wi}">+ תרגיל</button></div>
    ${w.items.map((it,ii)=>`<div class="row between" style="border-top:1px solid var(--line);padding-top:8px">
      <div><div>${ex(it.ex).name} ${ex(it.ex).video?'<span class="badge">סרטון</span>':''}</div>
      <div class="muted small mono">${it.sets} סטים · ${it.reps} חזרות · ${it.weight?it.weight+' ק"ג':'משקל גוף'}</div></div>
      <button class="btn sec small" data-a="go" data-v="swap" data-p="${id}|${wi}|${ii}">החלפה</button></div>`).join('')}
  </div>`).join('')}
  <button class="btn sec" data-a="addWorkout" data-p="${id}">+ אימון נוסף</button>
  <button class="btn" data-a="saveProgram" data-p="${id}">שמירה</button>
  <button class="btn sec" data-a="newProgram" data-p="${id}">בניית תוכנית חדשה במקום הזו</button>
  ${inactive.length?`<div class="muted small">תוכניות קודמות (לא פעילות): ${inactive.map(x=>x.name+' עד '+fmt(x.until)).join(', ')}</div>`:''}
  ${Q('האם החלפת תרגיל מהירה מספיק, ביחס למה שאתה עושה היום?')}`);
};

screens.swap=({id})=>{

  return shell('החלפת תרגיל',ex(it.ex).name,`

screens.exercises=()=>shell('רשימת התרגילים','תרגילים',`

   ${w.rows.map(r=>`<div class="small">${ex(r.ex).name}: <span class="mono">${r.sets.map(s=>s.done?(s.weight?s.weight+'×'+s.reps:s.reps):'—').join(' | ')}</span></div>`).join('')}

screens.paymentsCoach=({id})=>{

   <div class="row"><button class="btn small" data-a="lateDecide" data-p="${r.id}|ok">אישור</button><button class="btn sec small" data-a="lateDecide" data-p="${r.id}|no">דחייה</button></div></div>`).join('')}`:''}
  <div class="list">${up.map(c=>`<button class="item" data-a="go" data-v="classCoach" data-p="${c.id}"><div><div>${fmt(c.date)} · ${c.time} · ${c.place}</div>
    <div class="muted small">${c.cancelled?'בוטל':`${c.reg.length}/${c.cap} רשומים${c.wait.length?' · '+c.wait.length+' בהמתנה':''}`}</div></div>
    ${c.date<TODAY?'<span class="badge">עבר</span>':''}</button>`).join('')}</div>
  <button class="btn" data-a="go" data-v="classNew">פרסום שיעור</button>
  ${Q('האם ברור לך מי מגיע לכל שיעור?')}`,{backBtn:S.stack.length>1});
};
screens.classNew=()=>shell('שיעור קבוצתי','פרסום שיעור',`
  <div class="grid2"><div><label>תאריך</label><input id="clDate" type="date" value="2026-10-02"></div><div><label>שעה</label><input id="clTime" type="time" value="18:30"></div></div>
  <div><label>מקום</label><input id="clPlace" value="פארק הירקון"></div>

screens.classCoach=({id})=>{const c=classes.find(x=>x.id===id);const past=c.date<TODAY;return shell(`${fmt(c.date)} · ${c.time}`,c.place,`

  ${Q(past?'האם סימון הנוכחות מהיר מספיק לסוף שיעור?':'האם רשימת הנרשמים וההמתנה ברורה לך?')}`)};

/* ----- עוד והגדרות (טבלת הייחוס) ----- */
screens.more=()=>shell('כלים','עוד',`
  <div class="list">
   <button class="item" data-a="go" data-v="exercises"><span>רשימת התרגילים והסרטונים</span><span>›</span></button>
   <button class="item" data-a="go" data-v="challengeCoach"><span>אתגר שבועי</span><span>›</span></button>
   <button class="item" data-a="go" data-v="rewardsCoach"><span>תגמולים ומימושים</span><span>›</span></button>
   <button class="item" data-a="go" data-v="paymentsCoach"><span>תשלומים וחשבוניות</span><span>›</span></button>
   <button class="item" data-a="go" data-v="settings"><span>הגדרות: מטבעות, מחירים ונוסחים</span><span>›</span></button>
   <button class="item" data-a="logout"><span>יציאה לבחירת תפקיד</span><span>›</span></button>
  </div>${Q('האם אתה מוצא כל כלי במקום שציפית?')}`,{backBtn:false});
screens.settings=()=>shell('בלי קוד','הגדרות',`
  <div class="card col"><b>מטבעות לכל פעולה</b>
   <div class="grid2">${Object.entries({workout:'אימון שנשמר',goal:'יעד אישי',challenge:'אתגר שבועי',attendance:'הגעה לשיעור'}).map(([k,l])=>`<div><label>${l}</label><input type="number" data-ref="coins.${k}" value="${ref.coins[k]}"></div>`).join('')}</div></div>
  <div class="card col"><b>מחירים (₪)</b><div class="grid2"><div><label>מנוי חודשי</label><input type="number" data-ref="prices.monthly" value="${ref.prices.monthly}"></div><div><label>חבילת 10 אימונים</label><input type="number" data-ref="prices.pack10" value="${ref.prices.pack10}"></div></div></div>
  <div class="card col"><b>כללים</b><div class="grid2">
   <div><label>ביטול עד (שעות לפני שיעור)</label><input type="number" data-ref="cancelHours" value="${ref.cancelHours}"></div>
   <div><label>רצף: ימים מרביים בין אימונים</label><input type="number" data-ref="streakGapDays" value="${ref.streakGapDays}"></div></div></div>
  <div class="card col"><b>נוסחי משוב</b>
   <div><label>השלמה מלאה</label><input data-ref="feedback.full" value="${ref.feedback.full}"></div>
   <div><label>השלמה חלקית</label><input data-ref="feedback.partial" value="${ref.feedback.partial}"></div>
   <div><label>שיא אישי</label><input data-ref="feedback.pr" value="${ref.feedback.pr}"></div></div>
  <button class="btn" data-a="saveSettings">שמירה</button>
  ${Q('האם אלה הערכים שתרצה לשלוט בהם בעצמך?')}`);

/* ================= מתאמן ================= */
screens.traineeHome=()=>{
  const me=S.me; const p=programs[me];
  const nextW=p&&p.workouts[(results.filter(r=>r.tid===me).length/3|0)%p.workouts.length];
  const nextC=classes.filter(c=>!c.cancelled&&c.date>=TODAY&&c.reg.includes(me)).sort((a,b)=>a.date-b.date)[0];
  const cp=challengeProgress(me);
  const offers=classes.filter(c=>c.offer&&c.offer.tid===me);
  const msgs=inbox[me]||[];
  return shell(ref.reminder,'הבית שלי',`
  <div class="hero row between"><div><div class="sub">רצף אימונים</div><div class="big">${streak(me)} 🔥</div><div class="sub">לא מתאפס עד ${ref.streakGapDays} ימים בין אימונים</div></div>
   <div><div class="sub">מטבעות</div><div class="big">${balance(me)}</div></div></div>
  ${offers.map(c=>`<div class="notice col"><b>התפנה מקום!</b><div>בשיעור ב-${fmt(c.date)} בשעה ${c.time}. המקום שמור לך ${ref.spotOfferHours} שעות.</div>
    <div class="row"><button class="btn small" data-a="offerYes" data-p="${c.id}">אני מגיע</button><button class="btn sec small" data-a="offerNo" data-p="${c.id}">לא הפעם</button></div></div>`).join('')}
  ${msgs.map(m=>`<div class="notice small">🔔 ${m.text}</div>`).join('')}
  <div class="list">
   <button class="item" data-a="${nextW?'startWorkout':'noop'}" data-p="${nextW?nextW.id:''}"><div><div class="muted small">האימון הבא</div><div>${nextW?nextW.name:'התוכנית שלך בהכנה אצל המאמן'}</div></div><span>›</span></button>
   <button class="item" data-a="tab" data-v="classesTrainee"><div><div class="muted small">השיעור הבא שלך</div><div>${nextC?fmt(nextC.date)+' · '+nextC.time+' · '+nextC.place:'לא נרשמת לשיעור'}</div></div><span>›</span></button>
   <button class="item" data-a="go" data-v="challengeTrainee"><div><div class="muted small">האתגר השבועי</div><div>${cp.exempt?'השבוע אתה פטור':`${challenge.name}: ${cp.value}/${cp.target}`}</div></div><span>›</span></button>
  </div>
  ${Q('האם המסך הזה גורם לך לרצות לפתוח את האפליקציה מחר?')}`,{backBtn:false});
};

screens.workoutPick=()=>{const p=programs[S.me];return shell('התוכנית שלי','אימון',p?`
  <div class="list">${p.workouts.map(w=>`<button class="item" data-a="startWorkout" data-p="${w.id}"><div><div>${w.name}</div><div class="muted small">${w.items.map(i=>ex(i.ex).name).join(' · ')}</div></div><span>›</span></button>`).join('')}</div>
  ${Q('האם ברור לך איזה אימון לעשות היום?')}`:`<div class="empty">התוכנית שלך עוד בהכנה אצל המאמן.</div>${Q('האם ההודעה ברורה?')}`,{backBtn:false})};

/* ----- הזנת תוצאות (מקרה שימוש 3) ----- */
let draft=null;
screens.workout=({id})=>{
  const w=programs[S.me].workouts.find(x=>x.id===id);
  if(!draft||draft.wid!==id) draft={wid:id,items:w.items.map(it=>({ex:it.ex,sets:Array.from({length:it.sets},()=>({reps:it.reps,weight:it.weight,done:true}))}))};
  return shell('ממולא לפי היעד · שנה רק מה ששונה',w.name,`
  ${draft.items.map((it,ii)=>{const e=ex(it.ex);const tgt=w.items[ii];return `<div class="card col">
    <div class="row between"><b>${e.name}</b>${e.video?`<button class="link" data-a="go" data-v="exerciseView" data-p="${e.id}">▶︎ סרטון הדגמה</button>`:''}</div>
    <div class="muted small mono">יעד: ${tgt.sets}×${tgt.reps}${tgt.weight?' · '+tgt.weight+' ק"ג':''}</div>
    <div class="setrow muted small"><span>סט</span><span>חזרות</span><span>${e.body?'':'משקל'}</span><span>בוצע</span></div>
    ${it.sets.map((s,si)=>`<div class="setrow"><span class="mono">${si+1}</span>
      <input type="number" value="${s.reps}" data-set="${ii}|${si}|reps">
      ${e.body?'<span></span>':`<input type="number" step="2.5" value="${s.weight}" data-set="${ii}|${si}|weight">`}
      <button class="check ${s.done?'on':''}" data-a="toggleSet" data-p="${ii}|${si}">${s.done?'✓':''}</button></div>`).join('')}
  </div>`}).join('')}
  <button class="btn" data-a="saveWorkout">שמירת האימון</button>
  ${Q('האם שמירת אימון שבוצע כמתוכנן לוקחת לחיצה אחת, כמו שצריך?')}`);
};
screens.exerciseView=({id})=>{const e=ex(id);return shell('סרטון הדגמה',e.name,`<div class="video">▶︎ ${e.video==='youtube'?'סרטון הדגמה מיוטיוב (קישור לדוגמה)':'סרטון שהמאמן העלה (דוגמה)'}</div>${Q('האם הסרטון ברור מספיק כדי לבצע נכון לבד?')}`)};

/* ----- משוב (מקרה שימוש 6) ----- */
screens.feedback=({id})=>{const f=id;return shell('משוב','כל הכבוד!',`
  <div class="hero"><div class="sub">הושלמו</div><div class="big">${f.done}/${f.total} סטים</div></div>
  ${f.prs.length?`<div class="notice"><b>🏆 ${ref.feedback.pr}</b><div class="small">${f.prs.join(', ')}</div></div>`:''}
  <div class="card">${f.done===f.total?ref.feedback.full:ref.feedback.partial}</div>
  <div class="card row between"><span>מטבעות שנצברו</span><span class="mono">+${f.coins}</span></div>
  ${f.goal?`<div class="notice">🎯 השגת את היעד האישי! +${ref.coins.goal} מטבעות</div>`:''}
  ${f.chal?`<div class="notice">⭐ השלמת את האתגר השבועי! +${ref.coins.challenge} מטבעות</div>`:''}
  <button class="btn" data-a="tab" data-v="traineeHome">חזרה לבית</button>
  <button class="btn sec" data-a="go" data-v="myWorkouts">האימונים שלי ותיקון תוצאה</button>
  ${Q('האם המשוב גורם לך להרגיש שההתקדמות שלך נראית?')}`,{backBtn:false})};

screens.myWorkouts=()=>{
  const me=S.me; const byW={}; results.filter(r=>r.tid===me).forEach(r=>{const k=r.date.toDateString()+r.wid;(byW[k]=byW[k]||{date:r.date,rows:[]}).rows.push(r)});
  return shell('היסטוריה','האימונים שלי',`
  ${Object.entries(byW).sort((a,b)=>b[1].date-a[1].date).map(([k,w])=>`<div class="card col"><div class="row between"><b>${fmt(w.date)}</b><button class="link" data-a="go" data-v="correct" data-p="${k}">תיקון</button></div>
   ${w.rows.map(r=>`<div class="small">${ex(r.ex).name}: <span class="mono">${r.sets.map(s=>s.done?(s.weight?s.weight+'×'+s.reps:s.reps):'—').join(' | ')}</span>${r.corrected?' <span class="badge warn">תוקן</span>':''}</div>`).join('')}
   ${notes[k]?`<div class="notice small">💬 הערת המאמן: ${notes[k]}</div>`:''}</div>`).join('')||'<div class="empty">עוד אין אימונים</div>'}
  ${Q('האם קל למצוא אימון קודם ולתקן בו טעות?')}`);
};
screens.correct=({id})=>{const rows=results.filter(r=>r.tid===S.me&&(r.date.toDateString()+r.wid)===id);return shell('תיקון תוצאה','תיקון',`
  ${rows.map((r,ri)=>`<div class="card col"><b>${ex(r.ex).name}</b>${r.sets.map((s,si)=>`<div class="setrow"><span class="mono">${si+1}</span><input type="number" value="${s.reps}" data-fix="${ri}|${si}|reps"><input type="number" value="${s.weight}" data-fix="${ri}|${si}|weight"><span></span></div>`).join('')}</div>`).join('')}
  <div class="muted small">התיקון לא משנה את המטבעות, והמאמן יראה שהערך תוקן.</div>
  <button class="btn" data-a="saveFix" data-p="${id}">שמירת התיקון</button>
  ${Q('האם ברור שהתיקון גלוי למאמן?')}`)};

/* ----- גרף התקדמות (מקרה שימוש 5) ----- */
screens.progress=({id})=>{
  const tid=id||S.me; const p=programs[tid];
  const exIds=[...new Set(results.filter(r=>r.tid===tid).map(r=>r.ex))];
  const planEx=p?p.workouts.flatMap(w=>w.items.map(i=>i.ex)).filter(x=>exIds.includes(x)):[];
  const sel=S.params.pex&&exIds.includes(S.params.pex)?S.params.pex:(planEx[0]||exIds[0]); // ברירת מחדל: התרגיל הראשון בתוכנית שיש לו תוצאות
  if(!sel) return shell('התקדמות','גרף התקדמות',`<div class="empty">הגרף יופיע אחרי האימונים הראשונים.</div>${Q('האם ההודעה ברורה?')}`);
  const pts=chartPoints(tid,sel); const e=ex(sel);
  const W=340,H=180,P=28; const vals=pts.map(x=>x.v); const mn=Math.min(...vals)*0.9, mx=Math.max(...vals)*1.05||1;
  const X=i=>P+(W-2*P)*(pts.length>1?i/(pts.length-1):.5), Y=v=>H-P-(H-2*P)*((v-mn)/((mx-mn)||1));
  const best=Math.max(...vals); const bi=vals.lastIndexOf(best);
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="גרף התקדמות">
    <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map((q,i)=>X(i)+','+Y(q.v)).join(' ')}"/>
    ${pts.map((q,i)=>`<circle cx="${X(i)}" cy="${Y(q.v)}" r="${i===bi?6:3.5}" fill="${i===bi?'var(--lime)':'var(--accent)'}" stroke="${i===bi?'var(--ink)':'none'}"/>`).join('')}
    ${pts.map((q,i)=>i%2===0?`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${fmt(q.date)}</text>`:'').join('')}
    <text x="${X(bi)}" y="${Y(best)-12}" text-anchor="middle">שיא ${best}</text></svg>`;
  return shell(tname(tid),'גרף התקדמות',`
  <div class="row" style="flex-wrap:wrap;gap:6px">${exIds.map(x=>`<button class="pill ${x===sel?'on':''}" data-a="pex" data-v="${x}">${ex(x).name}</button>`).join('')}</div>
  <div class="card">${svg}<div class="muted small">${e.body?'מספר החזרות הגבוה בכל אימון (תרגיל משקל גוף)':'המשקל הגבוה בכל אימון, בק"ג'}. הנקודה המודגשת היא השיא האישי.</div></div>
  ${Q(S.role==='coach'?'האם מהגרף ברור לך אם לשנות את התוכנית?':'האם הגרף מראה לך בבירור שאתה משתפר?')}`);
};

screens.classesTrainee=()=>{const me=S.me;const up=classes.filter(c=>c.date>=TODAY).sort((a,b)=>a.date-b.date);return shell('שיעורים קבוצתיים','שיעורים',`
  <div class="list">${up.map(c=>{const r=c.reg.includes(me),w=c.wait.indexOf(me);const free=c.cap-c.reg.length;

   w>=0?`<span class="badge warn">ברשימת המתנה, מקום ${w+1}</span>`:
   free>0?`<div class="row between"><span class="muted small">${free} מקומות פנויים</span><button class="btn small" data-a="register" data-p="${c.id}">הרשמה</button></div>`:

  <div class="muted small">אפשר לבטל עד ${ref.cancelHours} שעות לפני השיעור. אחרי זה אפשר לשלוח למאמן בקשה חריגה.</div>
  ${Q('האם ההרשמה והביטול פשוטים וברורים?')}`,{backBtn:false})};

screens.lateCancel=({id})=>{const c=classes.find(x=>x.id===id);return shell('ביטול מאוחר',`${fmt(c.date)} · ${c.time}`,`
  <div class="warnbox">אפשר לבטל עד ${ref.cancelHours} שעות לפני השיעור, ולכן ההרשמה נשארת בינתיים.</div>
  <div>אפשר לשלוח למאמן בקשה חריגה. אם הוא יאשר, ההרשמה תבוטל ותקבל הודעה.</div>

/* ----- אני: התקדמות, מטבעות, תשלומים, אתגר ----- */
screens.me=()=>shell(tname(S.me),'אני',`
  <div class="list">
   <button class="item" data-a="go" data-v="progress"><span>גרף ההתקדמות שלי</span><span>›</span></button>
   <button class="item" data-a="go" data-v="myWorkouts"><span>האימונים שלי והערות המאמן</span><span>›</span></button>
   <button class="item" data-a="go" data-v="coins"><span>מטבעות ותגמולים</span><span class="mono">${balance(S.me)}</span></button>
   <button class="item" data-a="go" data-v="challengeTrainee"><span>האתגר השבועי</span><span>›</span></button>
   <button class="item" data-a="go" data-v="paymentsTrainee"><span>תשלומים וחשבוניות</span><span>${payments.some(p=>p.tid===S.me&&p.status==='פתוחה')?'<span class="badge warn">לתשלום</span>':'›'}</span></button>
   <button class="item" data-a="logout"><span>יציאה לבחירת תפקיד</span><span>›</span></button>
  </div>${Q('האם מצאת כל דבר במקום שציפית?')}`,{backBtn:false});

screens.coins=()=>{const me=S.me;const bal=balance(me);const lbl={workout:'אימון',goal:'יעד אישי',challenge:'אתגר שבועי',attendance:'הגעה לשיעור',redeem:'מימוש'};return shell('מטבעות','מטבעות ותגמולים',`
  <div class="hero"><div class="sub">היתרה שלך</div><div class="big">${bal}</div></div>
  <h2>תגמולים</h2>
  <div class="list">${rewards.map(r=>`<div class="item" style="cursor:default"><div><div>${r.name}</div><div class="muted small mono">${r.price} מטבעות</div></div>
    ${S.params.confirmRedeem===r.id?`<div class="row"><button class="btn small" data-a="redeem" data-p="${r.id}">אישור (יישארו ${bal-r.price})</button><button class="btn sec small" data-a="cancelRedeem">ביטול</button></div>`:bal>=r.price?`<button class="btn small" data-a="redeem" data-p="${r.id}">מימוש</button>`:`<span class="muted small">חסרים ${r.price-bal}</span>`}</div>`).join('')}</div>
  <h2>היסטוריה</h2>
  <div class="list">${coinLedger.filter(c=>c.tid===me).slice().reverse().map(c=>`<div class="row between small"><span>${lbl[c.type]||c.type} · ${fmt(c.date)}</span><span class="mono">${c.amt>0?'+':''}${c.amt}</span></div>`).join('')}</div>
  ${Q('האם המטבעות והתגמולים ירגשו אותך להמשיך?')}`)};

screens.challengeTrainee=()=>{const cp=challengeProgress(S.me);return shell(`עד ${fmt(challenge.end)}`,'האתגר השבועי',`
  <div class="hero"><div class="sub">${challenge.name}</div>${cp.exempt?'<div class="big">השבוע אתה פטור</div>':`<div class="big">${cp.value}/${cp.target}</div>`}
  <div class="sub">פרס: ${ref.coins.challenge} מטבעות + ${challenge.prize}</div></div>
  <div class="muted small">ההשלמה נספרת לבד מהאימונים שאתה שומר. אין צורך לדווח שוב.</div>
  ${Q('האם האתגר מעניין ומאתגר?')}`)};

screens.paymentsTrainee=()=>{const list=payments.filter(p=>p.tid===S.me).sort((a,b)=>b.date-a.date);return shell('הדגמה, לא מתבצע חיוב','תשלומים',`
  <div class="list">${list.map(p=>`<div class="card col"><div class="row between"><span>${payLabel[p.type]}</span><span class="mono">₪${p.amount}</span></div>
   ${p.status==='פתוחה'?`<span class="badge demo">הדגמה: אין שדה כרטיס ולא מתבצע חיוב</span><button class="btn" data-a="payDemo" data-p="${p.id}">תשלום לדוגמה</button>`:
   `<button class="btn sec small" data-a="go" data-v="invoice" data-p="${p.id}">חשבונית ${p.invoice}</button>`}</div>`).join('')}</div>
  ${Q('האם תשלום מתוך האפליקציה נוח לך?')}`)};

/* ================= פעולות ================= */
const actions={
  back, tab:(v)=>setTab(v), go:(v,p)=>go(v,{id:p}), noop:()=>{},
  theme:()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'},
  role:(v)=>{S.role=v;setTab(v==='coach'?'coachHome':'traineeHome')},
  logout:()=>{S.role=null;S.tab=null;S.stack=[];render()},
  acceptInvite:()=>{const t=trainees.find(x=>x.id==='t4');t.joined=true;S.role='trainee';S.me='t4';setTab('traineeHome');toast('הצטרפת! המאמן יבנה לך תוכנית')},
  expiredInvite:()=>toast('ההזמנה כבר לא בתוקף. בקש מהמאמן הזמנה חדשה'),
  sendInvite:()=>{const n=document.getElementById('invName').value.trim(),m=document.getElementById('invMail').value.trim();
    if(!n||!/^\S+@\S+\.\S+$/.test(m))return toast('פרט הקשר לא תקין. בדוק ונסה שוב');
    trainees.push({id:'t'+uid(),name:n+' (דוגמה)',joined:false});back();toast('ההזמנה נשלחה במייל')},
  copyInvite:()=>toast('הקישור הועתק. אפשר לשתף אותו בוואטסאפ'),
  newProgram:(p)=>{if(programs[p]){(inactivePrograms[p]=inactivePrograms[p]||[]).push({name:'תוכנית קודמת',until:TODAY})}
    programs[p]={active:true,workouts:[{id:'w'+uid(),name:'אימון A',items:[]}]};render();toast('נפתחה תוכנית חדשה. הקודמת נשמרה כלא פעילה')},
  addWorkout:(p)=>{const w=programs[p].workouts;w.push({id:'w'+uid(),name:'אימון '+'ABCDEFG'[w.length],items:[]});render()},
  addItem:(p)=>{const [tid,wi]=p.split('|');programs[tid].workouts[wi].items.push({ex:'e7',sets:3,reps:10,weight:20});
    go('itemTarget',{id:`${tid}|${wi}|${programs[tid].workouts[wi].items.length-1}`})},
  saveTarget:(p)=>{const [tid,wi,ii]=p.split('|');const it=programs[tid].workouts[wi].items[ii];
    const s=+tS.value,r=+tR.value,w=+tW.value; if(!(s>0&&r>0&&w>=0))return toast('חסר מידע בתרגיל. השלם סטים, חזרות ומשקל ונסה שוב');
    Object.assign(it,{sets:s,reps:r,weight:w});back();toast('היעד נשמר')},
  doSwap:(p)=>{const [tid,wi,ii,e]=p.split('|');programs[tid].workouts[wi].items[ii].ex=e;S.stack.pop();go('itemTarget',{id:`${tid}|${wi}|${ii}`});toast('התרגיל הוחלף באותו מקום')},
  saveProgram:(p)=>{const bad=programs[p].workouts.some(w=>!w.items.length);if(bad)return toast('יש אימון בלי תרגילים. הוסף תרגיל או מחק את האימון');toast('התוכנית נשמרה, והמתאמן כבר רואה אותה')},
  addExercise:()=>{const n=exName.value.trim();if(!n)return toast('חסר שם לתרגיל');exercises.push({id:'e'+uid(),name:n,body:exBody.checked,video:null});back();toast('התרגיל נוסף לרשימה')},
  attachLink:(p)=>{const v=vidLink.value.trim();if(!/^https?:\/\//.test(v))return toast('זה לא נראה כמו סרטון. נסה קישור אחר');ex(p).video='youtube';render();toast('הסרטון צורף, ומופיע בכל התוכניות')},
  uploadOk:(p)=>{ex(p).video='upload';render();toast('הסרטון עלה (דוגמה)')},
  uploadLong:()=>toast('אפשר להעלות סרטון של עד דקה'),
  saveGoal:(p)=>{const v=+gVal.value;if(!(v>0))return toast('חסר משקל יעד');goals[p]={ex:gEx.value,value:v,status:'פעיל'};back();toast('היעד נשמר')},
  saveNote:(p)=>{const t=noteTxt.value.trim();if(!t||t.length>280)return toast('ההערה ריקה או ארוכה מדי. קצר אותה ונסה שוב');
    const [tid,k]=p.split(/\|(.+)/);notes[k]=t;(inbox[tid]=inbox[tid]||[]).unshift({text:'המאמן הוסיף הערה לאימון שלך',date:TODAY});back();toast('ההערה נשמרה, והמתאמן יראה אותה')},
  createPayReq:()=>{payments.push({id:'p'+uid(),tid:prT.value,type:prType.value,amount:ref.prices[prType.value],status:'פתוחה',date:TODAY,invoice:null});back();toast('בקשת התשלום נשלחה למתאמן')},
  payDemo:(p)=>{const x=payments.find(y=>y.id===p);if(x.status==='שולמה')return toast('הבקשה הזו כבר שולמה');x.status='שולמה';x.invoice=invoiceSeq++;render();toast('התשלום לדוגמה הושלם, וחשבונית נוצרה')},
  prizeDelivered:(p)=>{challenge.completions.find(c=>c.tid===p).delivered=true;render();toast('סומן: הפרס נמסר')},
  chType:(v)=>{document.querySelectorAll('#chType button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));S.params.chType=v},
  createChallenge:()=>toast('כבר יש אתגר השבוע. אפשר ליצור את הבא בשבוע הבא'),
  addReward:()=>{const n=rwName.value.trim(),pr=+rwPrice.value;if(!n||!(pr>0))return toast('חסר שם או מחיר');rewards.push({id:'rw'+uid(),name:n,price:pr});render();toast('התגמול נוסף לקטלוג')},
  delivered:(p)=>{redemptions.find(r=>r.id===p).status='סופק';render();toast('סומן: התגמול סופק')},
  publishClass:()=>{const cap=+clCap.value;if(!(cap>0)||!clPlace.value.trim())return toast('חסרים פרטים בשיעור. השלם ונסה שוב');
    classes.push({id:'c'+uid(),date:new Date(clDate.value),time:clTime.value,place:clPlace.value,cap,reg:[],wait:[],attended:null,cancelled:false});back();toast('השיעור פורסם')},
  toggleAtt:(p)=>{const [cid,t]=p.split('|');const c=classes.find(x=>x.id===cid);c.attended=c.attended||[];c.attended=c.attended.includes(t)?c.attended.filter(x=>x!==t):[...c.attended,t];render()},
  saveAttendance:(p)=>{const c=classes.find(x=>x.id===p);let n=0;(c.attended||[]).forEach(t=>{if(award(t,'attendance','att-'+p+t))n++});toast(n?`הנוכחות נשמרה. ${n} מתאמנים קיבלו מטבעות`:'הנוכחות נשמרה')},
  cancelClass:(p)=>{const c=classes.find(x=>x.id===p);c.cancelled=true;[...c.reg,...c.wait].forEach(t=>(inbox[t]=inbox[t]||[]).unshift({text:`השיעור ב-${fmt(c.date)} בוטל בידי המאמן`,date:TODAY}));render();toast('השיעור בוטל, והנרשמים קיבלו הודעה')},
  lateDecide:(p)=>{const [id,d]=p.split('|');const r=lateRequests.find(x=>x.id===id);r.status=d==='ok'?'אושרה':'נדחתה';
    const c=classes.find(x=>x.id===r.cid);if(d==='ok'){c.reg=c.reg.filter(t=>t!==r.tid);offerNext(c)}
    (inbox[r.tid]=inbox[r.tid]||[]).unshift({text:`בקשת הביטול שלך ${r.status}`,date:TODAY});render();toast(`הבקשה ${r.status}`)},
  saveSettings:()=>{document.querySelectorAll('[data-ref]').forEach(i=>{const k=i.dataset.ref.split('.');let o=ref;while(k.length>1)o=o[k.shift()];o[k[0]]=i.type==='number'?+i.value:i.value});toast('ההגדרות נשמרו')},
  // מתאמן
  startWorkout:(p)=>{draft=null;go('workout',{id:p})},
  toggleSet:(p)=>{const [ii,si]=p.split('|');const s=draft.items[ii].sets[si];s.done=!s.done;render()},
  saveWorkout:()=>{
    for(const it of draft.items)for(const s of it.sets)if(!(s.reps>=0&&s.weight>=0)||isNaN(s.reps))return toast('יש ערך לא תקין באחד הסטים. בדוק ונסה שוב');
    const me=S.me,d=new Date(TODAY),prs=[];let done=0,total=0;
    draft.items.forEach(it=>{const e=ex(it.ex);const prev=chartPoints(me,it.ex).map(x=>x.v);const v=e.body?Math.max(...it.sets.filter(s=>s.done).map(s=>+s.reps),0):Math.max(...it.sets.filter(s=>s.done).map(s=>+s.weight),0);
      if(prev.length&&v>Math.max(...prev))prs.push(e.name);
      it.sets.forEach(s=>{total++;if(s.done)done++});
      results.push({tid:me,date:d,wid:draft.wid,ex:it.ex,sets:it.sets.map(s=>({...s})),corrected:false})});
    const refId='w-'+uid();const coins=award(me,'workout',refId);
    let goal=false;const g=goals[me];if(g&&g.status==='פעיל'){const it=draft.items.find(i=>i.ex===g.ex);if(it&&Math.max(...it.sets.map(s=>+s.weight))>=g.value){g.status='הושג, ממתין ליעד חדש';award(me,'goal','g-'+refId);goal=true}}
    let chal=false;const cp=challengeProgress(me);if(!cp.exempt&&cp.value>=cp.target&&!challenge.completions.some(c=>c.tid===me)){challenge.completions.push({tid:me,delivered:false});award(me,'challenge','ch-'+challenge.id+me);chal=true}
    draft=null;S.stack=[{screen:'feedback',params:{id:{done,total,prs,coins,goal,chal}}}];render()},
  saveFix:(p)=>{const rows=results.filter(r=>r.tid===S.me&&(r.date.toDateString()+r.wid)===p);
    document.querySelectorAll('[data-fix]').forEach(i=>{const [ri,si,f]=i.dataset.fix.split('|');const s=rows[ri].sets[si];if(+i.value!==+s[f]){s[f]=+i.value;rows[ri].corrected=true}});
    back();toast('התיקון נשמר. המטבעות לא השתנו, והמאמן יראה שהערך תוקן')},
  pex:(v)=>{S.params.pex=v;render()},
  register:(p)=>{const c=classes.find(x=>x.id===p),me=S.me;if(c.reg.includes(me)||c.wait.includes(me))return toast('אתה כבר רשום לשיעור הזה');
    if(c.reg.length<c.cap){c.reg.push(me);toast('נרשמת לשיעור')}else{c.wait.push(me);toast(`השיעור מלא. נכנסת לרשימת ההמתנה, מקום ${c.wait.length}`)}render()},
  cancelReg:(p)=>{const c=classes.find(x=>x.id===p),me=S.me;const hrs=(new Date(c.date.toDateString()+' '+c.time)-new Date(TODAY.toDateString()+' 12:00'))/36e5;
    if(hrs<ref.cancelHours){go('lateCancel',{id:p});return}
    c.reg=c.reg.filter(t=>t!==me);offerNext(c);render();toast('ההרשמה בוטלה')},
  sendLate:(p)=>{if(!lateRequests.some(r=>r.tid===S.me&&r.cid===p&&r.status==='ממתינה'))lateRequests.push({id:'l'+uid(),tid:S.me,cid:p,status:'ממתינה'});back();toast('הבקשה נשלחה למאמן')},
  cancelRedeem:()=>{S.params.confirmRedeem=null;render()},
  offerYes:(p)=>{const c=classes.find(x=>x.id===p);c.wait=c.wait.filter(t=>t!==S.me);c.reg.push(S.me);c.offer=null;render();toast('נרשמת לשיעור')},
  offerNo:(p)=>{const c=classes.find(x=>x.id===p);c.wait=c.wait.filter(t=>t!==S.me);c.offer=null;offerNext(c);render();toast('המקום הוצע לבא בתור')},
  redeem:(p)=>{const r=rewards.find(x=>x.id===p),me=S.me;if(balance(me)<r.price)return toast(`אין מספיק מטבעות. חסרים לך עוד ${r.price-balance(me)}`);
    if(S.params.confirmRedeem!==p){S.params.confirmRedeem=p;render();return}
    S.params.confirmRedeem=null;
    coinLedger.push({tid:me,type:'redeem',amt:-r.price,date:TODAY,ref:'rd-'+uid()});redemptions.push({id:'rd'+uid(),tid:me,reward:p,status:'ממתין לאספקה',date:TODAY});render();toast('מימשת! המאמן יספק את התגמול')},
};
function offerNext(c){ if(c.wait.length&&c.reg.length<c.cap){c.offer={tid:c.wait[0],until:ref.spotOfferHours};(inbox[c.wait[0]]=inbox[c.wait[0]]||[]).unshift({text:`התפנה מקום בשיעור ב-${fmt(c.date)}`,date:TODAY})} }

/* ---- חיבור אירועים ---- */
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=actions[b.dataset.a];if(f)f(b.dataset.v??b.dataset.p,b.dataset.p)});
app.addEventListener('input',e=>{const i=e.target;if(i.dataset.set){const [ii,si,f]=i.dataset.set.split('|');draft.items[ii].sets[si][f]=i.value===''?NaN:+i.value}});
function render(){const c=cur();app.innerHTML=(screens[c.screen]||screens.welcome)(c.params||{})}
render();
</script>
